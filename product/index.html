/* ------------------------------------------------ 交互 ------------------ */
function cellFromEvent(e){
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / S.cell);
  const y = Math.floor((e.clientY - r.top) / S.cell);
  if (x < 0 || y < 0 || x >= S.gw || y >= S.gh) return -1;
  return y*S.gw + x;
}
function act(cellIdx){
  if (cellIdx < 0 || !S.cells) return;
  const t = S.tool;
  if (t === 'inspect'){ S.selCell = cellIdx; inspect(cellIdx); requestDraw(); return; }
  // 吸色：只读，不改图纸。取完色仍留在吸色工具里，避免以为还在吸色、一拖就涂了格子
  if (t === 'picker'){
    S.selCell = cellIdx; inspect(cellIdx); requestDraw();
    const v = S.cells[cellIdx];
    if (v >= 0 && v < S.palette.length) setPaint(v, `已取色 ${S.palette[v].code} · 切到「铅笔」就能涂`);
    else toast('这一格是空的，没有颜色可取');
    return;
  }
  if (t === 'bucket'){
    if (!validPaint()) return;
    beginStroke();
    const n = floodFill(cellIdx, S.conn, S.paintIdx);
    endStroke();
    afterPaint();
    toast(n ? `已填充 ${n} 格` : '没有可填充的连通区域');
    return;
  }
  if (t === 'line' || t === 'rect' || t === 'ellipse'){
    if (!validPaint()) return;
    beginStroke();
    for (const i of shapeIndices(t, cellIdx, cellIdx)) paintCell(i, S.paintIdx);
    endStroke();
    afterPaint();
    return;
  }
  // 铅笔 / 橡皮
  if (t !== 'eraser' && !validPaint()) return;
  beginStroke();
  paintBrush(cellIdx, t === 'eraser' ? -1 : S.paintIdx);
  endStroke();
  renderUsage();
}
/* [hackone] v4 滚轮缩放：缓动动画，以光标为锚点 */
let zoomTarget = 0, zoomRaf = 0, zoomAnchor = null;
function syncCellUi(){
  const cs = Math.round(S.cell);
  if ($('cell')) $('cell').value = Math.max(2, Math.min(60, cs));
  if ($('cellV')) $('cellV').textContent = Math.max(2, Math.min(60, cs));
}
function applyZoomAnchor(){
  if (!zoomAnchor) return;
  const v = $('view'), r = canvas.getBoundingClientRect();
  v.scrollLeft += r.left + zoomAnchor.gx * S.cell - zoomAnchor.ax;
  v.scrollTop  += r.top  + zoomAnchor.gy * S.cell - zoomAnchor.ay;
}
function animateZoom(target, ax, ay){
  if (!S.cells) return;
  target = Math.max(2, Math.min(cellCap(), target));
  const r = canvas.getBoundingClientRect();
  if (r.width && ax != null){
    zoomAnchor = { gx:(ax - r.left) / S.cell, gy:(ay - r.top) / S.cell, ax, ay };
  }
  zoomTarget = target;
  if (zoomRaf) return;
  const step = () => {
    const diff = zoomTarget - S.cell;
    if (Math.abs(diff) < 0.12){
      S.cell = Math.round(zoomTarget * 100) / 100;
      zoomRaf = 0; syncCellUi(); applyZoomAnchor(); requestDraw(); return;
    }
    S.cell += diff * 0.26;            // 指数缓出，起步快、收尾慢
    syncCellUi(); applyZoomAnchor(); requestDraw();
    zoomRaf = requestAnimationFrame(step);
  };
  zoomRaf = requestAnimationFrame(step);
}
$('view').addEventListener('wheel', e => {
  if (!S.cells) return;
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  animateZoom((zoomTarget || S.cell) * k, e.clientX, e.clientY);
}, { passive:false });

/* [hackone] v1.2 拖拽平移：中键 / 空格+左键 / 查看工具下左键拖动
   此前没有任何平移实现，只能靠原生滚动条；Windows 触控板两指拖动、中键自动滚动
   恰好能滚，Linux 鼠标只有竖直滚轮，所以看起来"放大后拖不动"。
   这里自己实现，跨平台、跨设备行为一致。 */
let panState = null, spaceDown = false;
const viewEl = $('view');
function beginPan(e, capture){
  panState = { x:e.clientX, y:e.clientY, sl:viewEl.scrollLeft, st:viewEl.scrollTop,
               moved:false, pid:e.pointerId, captured:false };
  if (capture) capturePan();
}
function capturePan(){
  if (!panState || panState.captured) return;
  panState.captured = true;
  try { viewEl.setPointerCapture(panState.pid); } catch(err){}
  viewEl.classList.add('panning');
}
function movePan(e){
  if (!panState) return false;
  const dx = e.clientX - panState.x, dy = e.clientY - panState.y;
  if (!panState.moved && Math.abs(dx) + Math.abs(dy) > 3){
    panState.moved = true;
    capturePan();                 // 真的开始拖了才接管指针，保证单击还能被画布收到
  }
  if (panState.moved){
    viewEl.scrollLeft = panState.sl - dx;
    viewEl.scrollTop  = panState.st - dy;
  }
  return true;
}
function endPan(){
  if (!panState) return false;
  const moved = panState.moved;
  panState = null;
  viewEl.classList.remove('panning');
  return moved;
}
function panCursor(){
  if (canvas) canvas.classList.toggle('grab', S.tool === 'inspect');
}
viewEl.addEventListener('pointerdown', e => {
  if (!S.cells) return;
  if (e.button === 1){ e.preventDefault(); beginPan(e, true); return; }   // 中键：顺手掐掉 Linux 的粘贴/自动滚动
  if (e.button !== 0) return;
  if (spaceDown){ e.preventDefault(); beginPan(e, true); return; }
  if (e.target === canvas && S.tool === 'inspect') beginPan(e, false);
  else if (e.target === viewEl) beginPan(e, true);                        // 灰色底也能拖
});
viewEl.addEventListener('pointermove', e => { if (panState) movePan(e); });
window.addEventListener('pointerup', () => { endPan(); });
window.addEventListener('pointercancel', () => { endPan(); });
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || spaceDown) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
  spaceDown = true;
  if (S.cells){ viewEl.classList.add('spacepan'); e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  spaceDown = false;
  viewEl.classList.remove('spacepan');
});
window.addEventListener('blur', () => { spaceDown = false; viewEl.classList.remove('spacepan'); });

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (e.pointerType === 'touch' && e.isPrimary === false) return;
  if (panState && panState.captured) return;   // 中键/空格平移中，不落笔
  if (S.palOpen) closePalette();
  const i = cellFromEvent(e);
  if (i < 0 || !S.cells) return;
  // [hackone] 标记工具：只切完成态，不动图案
  if (S.tool === 'mark'){
    S.markSet = new Set([i]);
    S.markLast = i;
    S.dragging = 'mark';
    toggleProgress(i);
    S.selCell = i;
    inspect(i);
    requestDraw();
    return;
  }
  const t = S.tool;
  // [hackone] 查看工具：按下只记录，松手且没拖动才执行，拖动即平移画布
  if (t === 'inspect'){ S.pendingInspect = i; return; }
  if (t === 'picker' || t === 'bucket'){ act(i); return; }
  if (t === 'pencil' || t === 'eraser'){
    if (t !== 'eraser' && !validPaint()) return;
    beginStroke();
    S.dragging = true;
    paintBrush(i, t === 'eraser' ? -1 : S.paintIdx);
    return;
  }
  if (!validPaint()) return;
  S.drag = { tool:t, start:i, last:i };
  S.preview = { v:S.paintIdx, cells:[i] };
  requestDraw();
});
canvas.addEventListener('pointermove', e => {
  if (S.pinching) return;
  const i = cellFromEvent(e);
  if (i >= 0){
    if (i !== S.hoverCell){
      S.hoverCell = i;
      const x = i % S.gw + 1, y = ((i / S.gw) | 0) + 1;
      const v = S.cells ? S.cells[i] : -1;
      const lab = v < 0 ? '空' : S.palette[v].code;
      $('barPos').textContent = `${x},${y} → ${lab}`;
      requestDraw();
    }
    if (S.dragging === 'mark'){
      if (i !== S.markLast){
        S.markLast = i;
        if (!S.markSet.has(i)){ S.markSet.add(i); toggleProgress(i); }
      }
    }
    else if (S.drag) updatePreview(i);
    else if (S.dragging) paintBrush(i, S.tool === 'eraser' ? -1 : S.paintIdx);
  } else if (S.hoverCell >= 0){
    S.hoverCell = -1;
    $('barPos').textContent = '—';
    requestDraw();
  }
});
window.addEventListener('pointerup', () => {
  if (endPan()){ S.pendingInspect = -1; S.hoverCell = -1; requestDraw(); return; }
  if (S.pendingInspect >= 0){
    const pi = S.pendingInspect; S.pendingInspect = -1;
    if (pi >= 0 && S.cells) act(pi);
  }
  if (S.drag){
    const end = (S.drag.last !== undefined) ? S.drag.last : S.drag.start;
    commitShape(end);
  }
  if (S.dragging === 'mark'){
    S.dragging = false; S.markSet = null; S.markLast = -1;
    renderProgress();
  } else if (S.dragging){
    S.dragging = false;
    endStroke();
    renderUsage(); renderSimilar();
  }
});
canvas.addEventListener('pointerleave', () => { $('barPos').textContent = '—'; S.hoverCell = -1; requestDraw(); });

/* ------------------------------------------------ 导入 / 识别 ---------- */
/* 默认网格：整数倍放大，长边落在 32~80 格；超大图按比例缩到 400 以内，
   保证长宽比不变（老版本直接 clamp 会把人像压扁）。 */
function defaultGridFor(w, h){
  const maxSrc = Math.max(w, h);
  let k = 1;
  while (maxSrc*(k+1) <= 80 && maxSrc*k < 32) k++;
  let gw = w*k, gh = h*k;
  const big = Math.max(gw, gh);
  if (big > MAXDIM){ const f = MAXDIM/big; gw *= f; gh *= f; }
  return { w:clampN(gw), h:clampN(gh) };
}
function loadImage(src, name){
  const img = new Image();
  img.onload = () => {
    if (window.__docBeforeImport) window.__docBeforeImport();
    S.img = img; S.srcW = img.naturalWidth; S.srcH = img.naturalHeight;
    $('srcInfo').innerHTML = `已导入：<b>${name || '图片'}</b><br>原图 <b>${S.srcW}×${S.srcH}</b> 像素`;
    const g = defaultGridFor(S.srcW, S.srcH);
    S.gw = g.w; S.gh = g.h;
    S.flip = false; updateFlipBtn();          // 新图从原方向开始
    S.history.length = 0; S.future.length = 0; S.histBytes = 0;
    S.dirtyImg = false;
    mapCells();
    resetProgress();
    syncDocInputs(true);
    fit();
    if (window.__docAfterImport) window.__docAfterImport(name || '图片');
    toast('已生成网格，点格子可查看色号');
  };
  img.onerror = () => toast('图片加载失败');
  img.src = src;
}

/* ------------------------------------------------ 尺寸信息 -------------- */
function updateSizeInfo(){
  const box = $('sizeInfo');
  if (!box) return;
  if (!S.gw || !S.gh){ box.textContent = ''; return; }
  const b = paletteOf(S.brandId);
  const cols = Math.ceil(S.gw/29), rows = Math.ceil(S.gh/29);
  const parts = [`<b>${S.gw} × ${S.gh}</b>`, `${S.gw*S.gh} 颗`];
  if (b.pitch){
    parts.push(`<b>${(S.gw*b.pitch/10).toFixed(1)} × ${(S.gh*b.pitch/10).toFixed(1)} cm</b>`);
    parts.push(`${cols*rows} 块 29×29 底板`);
  } else {
    parts.push(`${b.short} 色卡 · ${cols*rows} 块底板`);
  }
  box.innerHTML = parts.join(' · ');
}

/* ------------------------------------------------ 导出 ------------------ */
function exportCellSize(){
  let cs = 46;
  while (cs > 8 && (S.gw*cs > 7000 || S.gh*cs > 7000)) cs -= 2;
  return cs;
}
function exportPNG(){
  if (!S.cells || !S.used.length){ toast('先生成网格'); return; }
  const maxExportPixels = matchMedia('(max-width: 700px)').matches ? 12e6 : 32e6;
  let cs = exportCellSize();
  const padL = 54, padT = 96, padR = 26, padB = 24;
  const legendRow = 20;
  const legendH = 56 + S.used.length * legendRow;
  while (cs > 8 && (padL + S.gw*cs + padR) * (padT + S.gh*cs + padB + legendH) > maxExportPixels) cs -= 2;
  const W = padL + S.gw*cs + padR;
  const H = padT + S.gh*cs + padB + legendH;
  if (W * H > maxExportPixels){
    toast('导出图片尺寸过大，请降低图纸格数后再导出');
    return;
  }

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);

  // 标题
  const b = paletteOf(S.brandId);
  c.fillStyle = '#111417';
  c.font = '700 22px "PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillText(`拼豆图纸 ${S.gw}×${S.gh} · ${b.short}${S.flip ? '（已左右翻转）' : ''}`, padL, 32);
  c.fillStyle = '#5a626e';
  c.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  const totalBeads = S.used.reduce((a, u) => a + u.c, 0);
  let sub = `共 ${S.used.length} 色 / ${totalBeads} 颗`;
  if (b.pitch) sub += ` · 约 ${(S.gw*b.pitch/10).toFixed(1)} × ${(S.gh*b.pitch/10).toFixed(1)} cm（${b.pitch}mm 豆）`;
  sub += ` · 约 ${Math.ceil(S.gw/29)*Math.ceil(S.gh/29)} 块 29×29 底板`;
  c.fillText(sub, padL, 54);

  const ox = padL, oy = padT;
  // 坐标
  c.font = '11px Consolas,monospace';
  c.fillStyle = '#8b93a1';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const step = cs >= 12 ? 1 : 5;
  for (let x = 0; x < S.gw; x += step) c.fillText(String(x+1), ox + x*cs + cs/2, oy - 12);
  c.textAlign = 'right';
  for (let y = 0; y < S.gh; y += step) c.fillText(String(y+1), ox - 8, oy + y*cs + cs/2);

  // 格子
  const showCodes = cs >= 16;
  if (showCodes){
    c.font = `600 ${Math.max(7, Math.min(11, Math.round(cs*0.36)))}px Consolas,monospace`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
  }
  for (let y = 0; y < S.gh; y++) for (let x = 0; x < S.gw; x++){
    const v = S.cells[y*S.gw + x];
    const px = ox + x*cs, py = oy + y*cs;
    if (v < 0){ c.fillStyle = '#f4f6f9'; c.fillRect(px, py, cs, cs); continue; }
    const p = S.palette[v];
    c.fillStyle = p.hex; c.fillRect(px, py, cs, cs);
    if (showCodes){
      c.fillStyle = textOn(p.rgb);
      c.fillText(p.code, px + cs/2, py + cs/2 + 0.5);
    }
  }
  // 网格 + 底板线
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 1;
  c.beginPath();
  for (let x = 0; x <= S.gw; x++){ const px = ox + x*cs + .5; c.moveTo(px, oy); c.lineTo(px, oy + S.gh*cs); }
  for (let y = 0; y <= S.gh; y++){ const py = oy + y*cs + .5; c.moveTo(ox, py); c.lineTo(ox + S.gw*cs, py); }
  c.stroke();
  c.strokeStyle = 'rgba(200,30,30,.8)'; c.lineWidth = 2;
  c.beginPath();
  for (let x = 29; x < S.gw; x += 29){ const px = ox + x*cs + .5; c.moveTo(px, oy); c.lineTo(px, oy + S.gh*cs); }
  for (let y = 29; y < S.gh; y += 29){ const py = oy + y*cs + .5; c.moveTo(ox, py); c.lineTo(ox + S.gw*cs, py); }
  c.stroke();

  // 用量清单
  let ly = oy + S.gh*cs + 42;
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillStyle = '#111417';
  c.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('用量清单', padL, ly - 20);
  c.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
  for (const u of S.used){
    const p = S.palette[u.i];
    c.fillStyle = p.hex;
    c.fillRect(padL, ly - 7, 14, 14);
    c.strokeStyle = 'rgba(0,0,0,.2)'; c.lineWidth = 1;
    c.strokeRect(padL + .5, ly - 6.5, 14, 14);
    c.fillStyle = '#111417';
    c.fillText(`${p.code}`, padL + 22, ly);
    c.fillStyle = '#5a626e';
    c.fillText(`${u.c} 颗  ${(100*u.c/totalBeads).toFixed(1)}%`, padL + 100, ly);
    ly += legendRow;
  }

  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `拼豆图纸_${S.gw}x${S.gh}_${b.short}${S.flip ? '_翻转' : ''}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('图纸已导出');
  });
}

/* ------------------------------------------------ [hackone] A4 拼装图导出 ---------- */
/* 复用 S.cells / S.palette / textOn 的渲染语义；不碰配色与匹配函数。 */
const A4_PAGE_W = 1240;
const A4_PAGE_H = 1754;
const A4_MARGIN = 64;
const MAX_A4_PRINT_PAGES = 16;

function a4Canvas(){ const cv = document.createElement('canvas'); cv.width = A4_PAGE_W; cv.height = A4_PAGE_H; return cv; }
function a4CropMarks(c){
  c.strokeStyle = '#444'; c.lineWidth = 1.5;
  const m = 26, L = 18;
  const corners = [[m,m,1,1],[A4_PAGE_W-m,m,-1,1],[m,A4_PAGE_H-m,1,-1],[A4_PAGE_W-m,A4_PAGE_H-m,-1,-1]];
  c.beginPath();
  for (const [x,y,sx,sy] of corners){
    c.moveTo(x,y); c.lineTo(x + L*sx,y);
    c.moveTo(x,y); c.lineTo(x,y + L*sy);
  }
  c.stroke();
}
function a4DrawCells(c, ox, oy, cs, startX, startY, cols, rows){
  const showCodes = cs >= 10;
  if (showCodes){
    c.font = `600 ${Math.max(7, Math.min(16, Math.round(cs*0.34)))}px Consolas,monospace`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
  }
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
    const v = S.cells[(startY+y)*S.gw + startX+x];
    const px = ox + x*cs, py = oy + y*cs;
    if (v < 0){ c.fillStyle = '#f4f6f9'; c.fillRect(px, py, cs, cs); continue; }
    const p = S.palette[v];
    c.fillStyle = p.hex; c.fillRect(px, py, cs, cs);
    if (showCodes){ c.fillStyle = textOn(p.rgb); c.fillText(p.code, px + cs/2, py + cs/2 + .5); }
  }
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 1;
  c.beginPath();
  for (let x = 0; x <= cols; x++){ const px = ox + x*cs + .5; c.moveTo(px, oy); c.lineTo(px, oy + rows*cs); }
  for (let y = 0; y <= rows; y++){ const py = oy + y*cs + .5; c.moveTo(ox, py); c.lineTo(ox + cols*cs, py); }
  c.stroke();
}
function a4EdgeNumbers(c, ox, oy, cs, startX, startY, cols, rows, every){
  c.fillStyle = '#6a7280'; c.font = '10px Consolas,monospace';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let x = 0; x < cols; x += every){
    const px = ox + x*cs + cs/2, n = String(startX + x + 1);
    c.fillText(n, px, oy - 14);
    c.fillText(n, px, oy + rows*cs + 14);
  }
  c.textAlign = 'right';
  for (let y = 0; y < rows; y += every){
    const py = oy + y*cs + cs/2, n = String(startY + y + 1);
    c.fillText(n, ox - 8, py);
    c.textAlign = 'left'; c.fillText(n, ox + cols*cs + 8, py); c.textAlign = 'right';
  }
  c.textAlign = 'left';
}
function a4Footer(c, text, page, total){
  c.strokeStyle = '#e2e6ec'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(A4_MARGIN, A4_PAGE_H - 82); c.lineTo(A4_PAGE_W - A4_MARGIN, A4_PAGE_H - 82); c.stroke();
  c.fillStyle = '#5a626e'; c.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(text, A4_MARGIN, A4_PAGE_H - 56);
  c.textAlign = 'right';
  c.fillText(`第 ${page} / ${total} 页`, A4_PAGE_W - A4_MARGIN, A4_PAGE_H - 56);
  c.textAlign = 'left';
}
function a4Header(c, title, sub){
  c.fillStyle = '#15181d'; c.font = '700 28px "PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillText(title, A4_MARGIN, 62);
  c.fillStyle = '#5a626e'; c.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText(sub, A4_MARGIN, 92);
}
function a4BoardOverlay(c, ox, oy, cs, cols, rows){
  // 总览页的 29×29 板界 + 行优先编号
  c.strokeStyle = 'rgba(200,30,30,.8)'; c.lineWidth = 2;
  c.beginPath();
  for (let x = BOARD_SIZE; x < cols; x += BOARD_SIZE){ const px = ox + x*cs + .5; c.moveTo(px, oy); c.lineTo(px, oy + rows*cs); }
  for (let y = BOARD_SIZE; y < rows; y += BOARD_SIZE){ const py = oy + y*cs + .5; c.moveTo(ox, py); c.lineTo(ox + cols*cs, py); }
  c.moveTo(ox + .5, oy + .5); c.lineTo(ox + cols*cs - .5, oy + .5);
  c.lineTo(ox + cols*cs - .5, oy + rows*cs - .5); c.lineTo(ox + .5, oy + rows*cs - .5); c.closePath();
  c.stroke();
  const bc = boardCols(), br = boardRows();
  const badge = Math.max(18, Math.min(28, cs*1.6));
  c.font = `700 ${Math.max(10, Math.round(badge*.62))}px Consolas,monospace`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let by = 0; by < br; by++) for (let bx = 0; bx < bc; bx++){
    const x = ox + bx*BOARD_SIZE*cs + 3, y = oy + by*BOARD_SIZE*cs + 3;
    c.fillStyle = 'rgba(200,30,30,.92)'; c.fillRect(x, y, badge, badge);
    c.fillStyle = '#fff'; c.fillText(String(boardNo(bx, by)), x + badge/2, y + badge/2 + .5);
  }
  c.textAlign = 'left';
}
function renderA4Overview(page, totalPages){
  const cv = a4Canvas(), c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, A4_PAGE_W, A4_PAGE_H);
  a4CropMarks(c);
  const totalBeads = S.used.reduce((a, u) => a + u.c, 0);
  const bc = boardCols(), br = boardRows();
  a4Header(c, '拼豆拼装图 · 总览', `${S.gw}×${S.gh} 格 · ${S.used.length} 色 / ${totalBeads} 颗 · ${bc*br} 块 29×29 底板`);
  const areaW = A4_PAGE_W - A4_MARGIN*2, areaH = A4_PAGE_H - 300;
  const cs = Math.max(4, Math.floor(Math.min(areaW / S.gw, areaH / S.gh)));
  const ox = A4_MARGIN + Math.floor((areaW - S.gw*cs)/2);
  const oy = 138 + Math.floor((areaH - S.gh*cs)/2);
  a4DrawCells(c, ox, oy, cs, 0, 0, S.gw, S.gh);
  a4EdgeNumbers(c, ox, oy, cs, 0, 0, S.gw, S.gh, 5);
  a4BoardOverlay(c, ox, oy, cs, S.gw, S.gh);
  a4Footer(c, `总览 · 共 ${bc*br} 块 29×29 底板 · 每块板单独一页`, page, totalPages);
  return cv;
}
function renderA4Board(bx, by, page, totalPages){
  const cv = a4Canvas(), c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, A4_PAGE_W, A4_PAGE_H);
  a4CropMarks(c);
  const sx = bx*BOARD_SIZE, sy = by*BOARD_SIZE;
  const cols = Math.min(BOARD_SIZE, S.gw - sx), rows = Math.min(BOARD_SIZE, S.gh - sy);
  const no = boardNo(bx, by);
  const totalBeads = S.used.reduce((a, u) => a + u.c, 0);
  a4Header(c, `第 ${no} 块板 · 第 ${by+1} 行 第 ${bx+1} 列`, `全局第 ${sx+1}–${sx+cols} 列 / 第 ${sy+1}–${sy+rows} 行 · ${S.used.length} 色 / ${totalBeads} 颗`);
  const areaW = A4_PAGE_W - A4_MARGIN*2 - 40, areaH = A4_PAGE_H - 310;
  const cs = Math.max(10, Math.floor(Math.min(areaW / cols, areaH / rows)));
  const ox = A4_MARGIN + 20 + Math.floor((areaW - cols*cs)/2);
  const oy = 138 + Math.floor((areaH - rows*cs)/2);
  a4DrawCells(c, ox, oy, cs, sx, sy, cols, rows);
  a4EdgeNumbers(c, ox, oy, cs, sx, sy, cols, rows, 1);
  c.strokeStyle = 'rgba(200,30,30,.85)'; c.lineWidth = 2;
  c.strokeRect(ox + .5, oy + .5, cols*cs - 1, rows*cs - 1);
  const bc = boardCols(), br = boardRows();
  const n = (dx, dy) => {
    const nx = bx + dx, ny = by + dy;
    return (nx >= 0 && nx < bc && ny >= 0 && ny < br) ? String(nx + ny*bc + 1) : '—';
  };
  a4Footer(c, `相邻：上 ${n(0,-1)} · 下 ${n(0,1)} · 左 ${n(-1,0)} · 右 ${n(1,0)}`, page, totalPages);
  return cv;
}
function buildA4Pages(){
  if (!S.cells || !S.used || !S.used.length) return [];
  const bc = boardCols(), br = boardRows(), totalPages = 1 + bc*br;
  const pages = [];
  pages.push({ label: '总览', url: renderA4Overview(1, totalPages).toDataURL('image/png') });
  let page = 2;
  for (let by = 0; by < br; by++) for (let bx = 0; bx < bc; bx++){
    pages.push({ label: `第 ${boardNo(bx, by)} 块板`, url: renderA4Board(bx, by, page++, totalPages).toDataURL('image/png') });
  }
  return pages;
}
function exportA4(){
  if (!S.cells || !S.used.length){ toast('先生成网格'); return; }
  const pageCount = 1 + boardCols()*boardRows();
  const pageLimit = matchMedia('(max-width: 700px)').matches ? 8 : MAX_A4_PRINT_PAGES;
  if (pageCount > pageLimit){
    toast(`共 ${pageCount} 页，超过当前设备的 A4 导出上限（${pageLimit} 页）；请缩小图纸后重试`);
    return;
  }
  const pages = buildA4Pages();
  if (!pages.length){ toast('没有可导出的内容'); return; }
  const win = window.open('', '_blank');
  if (!win){ toast('浏览器拦截了新窗口，请允许后重试'); return; }
  const doc = win.document;
  doc.open();
  doc.write('<!doctype html><html><head><meta charset="utf-8"><title>拼豆 A4 拼装图</title><style>@page{size:A4;margin:0}html,body{margin:0;background:#fff}img{display:block;width:210mm;height:297mm;break-after:page}img:last-child{break-after:auto}</style></head><body></body></html>');
  for (const p of pages){
    const img = doc.createElement('img');
    img.src = p.url; img.alt = p.label; img.loading = 'eager';
    doc.body.appendChild(img);
  }
  const imgs = Array.from(doc.images || []);
  doc.close();
  // [hackone] 等所有 A4 页解码完再唤起打印，避免前几页空白
  const ready = Promise.all(imgs.map(img => (img.decode ? img.decode().catch(() => {}) : Promise.resolve())));
  ready.then(() => {
    setTimeout(() => { try { win.focus(); win.print(); } catch (e) { /* 交给用户手动打印 */ } }, 100);
  });

}

function exportCSV(){
  if (!S.cells || !S.used.length){ toast('先生成网格'); return; }
  const b = paletteOf(S.brandId);
  const total = S.used.reduce((a, u) => a + u.c, 0);
  const head = ['色号', 'HEX', 'R', 'G', 'B', '颗数', '占比'];
  for (const cs of b.codeSystems) if (cs.id !== S.codeSys) head.push(cs.label);
  const lines = [head.join(',')];
  for (const u of S.used){
    const p = S.palette[u.i];
    const row = [p.code, p.hex, p.rgb[0], p.rgb[1], p.rgb[2], u.c, (100*u.c/total).toFixed(1) + '%'];
    for (const cs of b.codeSystems) if (cs.id !== S.codeSys) row.push(p.codes[cs.id] || '');
    lines.push(row.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(','));
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }));
  a.download = `拼豆用量_${S.gw}x${S.gh}_${b.short}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('用量清单已导出');
}

<script>
/* [hackone] v3：步进器 / 导入按钮 / 空白图纸 */
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function bump(b){
    var inp = $(b.dataset.for); if (!inp) return false;
    var v = (parseInt(inp.value, 10) || 0) + (+b.dataset.d);
    var lo = inp.min !== '' ? +inp.min : -9999, hi = inp.max !== '' ? +inp.max : 9999;
    var nv = Math.max(lo, Math.min(hi, v));
    var cur = parseInt(inp.value, 10) || 0;
    if (nv === cur) return false;
    inp.value = nv;
    return true;
  }
  function commit(inp){
    if (inp) inp.dispatchEvent(new Event('change', { bubbles: true }));
  }
  document.querySelectorAll('.stepper button').forEach(function(b){
    var timer = 0, repeat = 0, changed = false;
    function stop(apply){
      clearTimeout(timer); clearInterval(repeat); timer = 0; repeat = 0;
      if (apply !== false && changed){
        changed = false;
        commit($(b.dataset.for));
      }
    }
    b.addEventListener('pointerdown', function(e){
      e.preventDefault();
      changed = bump(b) || changed;
      timer = setTimeout(function(){
        repeat = setInterval(function(){ changed = bump(b) || changed; }, 45);
      }, 320);
    });
    ['pointerup','pointercancel'].forEach(function(ev){ b.addEventListener(ev, function(){ stop(true); }); });
    b.addEventListener('pointerleave', function(){ stop(false); });
    window.addEventListener('blur', function(){ stop(false); });
  });
  var ng = $('newGo');
  if (ng) ng.addEventListener('click', function(){
    var w = parseInt(($('newW')||{}).value, 10) || 32;
    var h = parseInt(($('newH')||{}).value, 10) || 32;
    newBlank(w, h);
  });
  var pill = $('importPill');
  if (pill) pill.addEventListener('click', function(){ $('file').click(); });
})();
</script>

<script>
/* [hackone] 多画布管理：IndexedDB 持久化 + 切换 */
(function(){
  var DOCS = window.__DOCS = { list: [], activeId: null, db: null, dirty: false, ready: false,
    applying: false, saving: false, revision: 0, pending: [], saveQueue: [], failedSaves: {}, saveErrorShown: false };
  var $ = function(id){ return document.getElementById(id); };
  var legacyDocRaw = '', legacyProgressRaw = '';
  try {
    legacyDocRaw = localStorage.getItem('hackone:doc:v1') || '';
    legacyProgressRaw = localStorage.getItem('hackone:progress:v1') || '';
  } catch(e){}
  function now(){ return Date.now(); }
  function newId(){ return 'd' + now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function openDB(){
    return new Promise(function(res, rej){
      if (!window.indexedDB) { rej(new Error('no-idb')); return; }
      var req = indexedDB.open('hackone', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('docs', { keyPath: 'id' }); };
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error); };
    });
  }
  function tx(mode, fn){
    return new Promise(function(res, rej){
      if (!DOCS.db) { rej(new Error('no-db')); return; }
      var t = DOCS.db.transaction('docs', mode);
      var s = t.objectStore('docs');
      var r = fn(s);
      t.oncomplete = function(){ res(r ? r.result : undefined); };
      t.onerror = function(){ rej(t.error); };
      t.onabort = function(){ rej(t.error || new Error('transaction-aborted')); };
    });
  }

  function markDirty(){
    if (!DOCS.ready || !DOCS.activeId || DOCS.applying) return;
    DOCS.dirty = true;
    DOCS.revision++;
  }

  function autoName(){
    var mx = 0;
    DOCS.list.forEach(function(d){
      var m = /^画布\s*(\d+)$/.exec(d.name || '');
      if (m) mx = Math.max(mx, +m[1]);
    });
    return '画布 ' + (mx + 1);
  }
  function findDoc(id){ for (var i = 0; i < DOCS.list.length; i++) if (DOCS.list[i].id === id) return DOCS.list[i]; return null; }
  function activeDoc(){ return DOCS.activeId ? findDoc(DOCS.activeId) : null; }

  function makeThumb(){
    if (!S.cells || !S.palette) return '';
    try {
      var gw = S.gw, gh = S.gh;
      var k = Math.max(1, Math.ceil(Math.max(gw, gh) / 72));
      var w = Math.max(1, Math.round(gw / k)), h = Math.max(1, Math.round(gh / k));
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var x = c.getContext('2d');
      var img = x.createImageData(w, h), d = img.data;
      for (var y = 0; y < h; y++){
        var sy = Math.min(gh - 1, Math.floor(y * gh / h));
        for (var xx = 0; xx < w; xx++){
          var sx = Math.min(gw - 1, Math.floor(xx * gw / w));
          var v = S.cells[sy * gw + sx], o = (y * w + xx) * 4;
          if (v < 0){ d[o] = 255; d[o+1] = 255; d[o+2] = 255; }
          else { var p = S.palette[v]; d[o] = p.rgb[0]; d[o+1] = p.rgb[1]; d[o+2] = p.rgb[2]; }
          d[o+3] = 255;
        }
      }
      x.putImageData(img, 0, 0);
      return c.toDataURL('image/png');
    } catch (e) { return ''; }
  }
  function snap(){
    if (!S.cells || !S.base || !DOCS.activeId) return null;
    var d = activeDoc() || {};
    return {
      id: DOCS.activeId, name: d.name || '画布',
      gw: S.gw, gh: S.gh,
      base: Int16Array.from(S.base),
      progress: Uint8Array.from(S.progress || []),
      brandId: S.brandId, codeSys: S.codeSys, maxColors: S.maxColors,
      thumb: makeThumb(),
      updatedAt: now()
    };
  }
  function flushSaveQueue(){
    if (DOCS.saving || !DOCS.saveQueue.length) return;
    var item = DOCS.saveQueue.shift();
    DOCS.saving = true;
    tx('readwrite', function(st){ return st.put(item.rec); }).then(function(){
      delete DOCS.failedSaves[item.rec.id];
      DOCS.saveErrorShown = false;
    }).catch(function(){
      if (findDoc(item.rec.id) && !DOCS.saveQueue.some(function(next){ return next.rec.id === item.rec.id; })){
        DOCS.failedSaves[item.rec.id] = item.rec;
      }
      if (!DOCS.saveErrorShown){
        DOCS.saveErrorShown = true;
        if (window.toast) toast('画布保存失败，请导出图纸备份');
      }
    }).then(function(){ DOCS.saving = false; flushSaveQueue(); });
  }
  function queueSave(rec, revision){
    delete DOCS.failedSaves[rec.id];
    DOCS.saveQueue = DOCS.saveQueue.filter(function(item){ return item.rec.id !== rec.id; });
    DOCS.saveQueue.push({ rec: rec, revision: revision });
  }
  function saveActive(){
    if (!DOCS.ready){
      var early = snap();
      if (early) DOCS.pending = DOCS.pending.map(function(rec){ return rec.id === early.id ? early : rec; });
      return;
    }
    Object.keys(DOCS.failedSaves).forEach(function(id){
      queueSave(DOCS.failedSaves[id], -1);
    });
    if (DOCS.activeId && DOCS.dirty){
      var rec = snap();
      if (rec){
        var revision = DOCS.revision;
        for (var i = 0; i < DOCS.list.length; i++) if (DOCS.list[i].id === rec.id){ DOCS.list[i] = rec; break; }
        queueSave(rec, revision);
        DOCS.dirty = false;
      }
    }
    flushSaveQueue();
  }

  function renderList(){
    var box = $('docList');
    if (!box) return;
    if ($('docCount')) $('docCount').textContent = DOCS.list.length;
    if (!DOCS.list.length){ box.innerHTML = '<div class="dempty">还没有画布</div>'; return; }
    var arr = DOCS.list.slice().sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); });
    box.innerHTML = arr.map(function(d){
      var on = d.id === DOCS.activeId ? ' on' : '';
      var thumb = d.thumb
        ? '<img class="dthumb" src="' + d.thumb + '" alt="">'
        : '<i class="dthumb"></i>';
      return '<div class="doc' + on + '" data-id="' + d.id + '">'
        + thumb
        + '<span class="dname">' + esc(d.name || '画布') + '</span>'
        + '<span class="dsize">' + d.gw + '×' + d.gh + '</span>'
        + '<button class="dren" title="改名">✎</button>'
        + '<button class="ddel" title="删除">✕</button></div>';
    }).join('');
  }

  function applyDoc(d, focus){
    if (!d) return;
    DOCS.applying = true;
    try {
    if (S.palOpen) closePalette();
    S.brandId = d.brandId || S.brandId;
    if ($('brand')) $('brand').value = S.brandId;
    colourSystemOptions();
    S.codeSys = d.codeSys || S.codeSys;
    S.maxColors = d.maxColors || 0;
    buildPalette({ remap:false });
    if ($('maxc')) $('maxc').value = S.maxColors;
    S.img = null; S.srcW = 0; S.srcH = 0;
    S.history.length = 0; S.future.length = 0; S.histBytes = 0;
    installDoc(d.gw, d.gh, Int32Array.from(d.base || []));
    var n = S.cells ? Math.ceil(S.cells.length / 8) : 0;
    S.progress = (d.progress && d.progress.length === n) ? Uint8Array.from(d.progress) : new Uint8Array(n);
    S.progressHash = progressPatternHash();
    DOCS.activeId = d.id;
    if ($('srcInfo')) $('srcInfo').textContent = d.name || '';
    renderProgress(); renderList(); requestDraw();
    if (focus !== false) fit();
    } finally { DOCS.applying = false; }
  }

  function createDoc(w, h, name){
    if (!S.cells && !DOCS.list.length) { /* 允许 */ }
    w = clampN(w); h = clampN(h);
    saveActive();
    var rec = {
      id: newId(), name: name || autoName(),
      gw: w, gh: h, base: Int16Array.from(new Int32Array(w * h).fill(-1)),
      progress: new Uint8Array(Math.ceil(w * h / 8)),
      brandId: S.brandId, codeSys: S.codeSys, maxColors: S.maxColors,
      updatedAt: now()
    };
    DOCS.list.push(rec);
    applyDoc(rec);
    if (!DOCS.ready) DOCS.pending.push(rec);
    markDirty();
    saveActive();
    toast('已新建 ' + w + '×' + h + ' 画布');
    return rec;
  }

  function openDoc(id){
    var d = findDoc(id);
    if (!d || d.id === DOCS.activeId) return;
    saveActive();
    applyDoc(d);
  }

  function deleteDoc(id){
    var d = findDoc(id);
    if (!d) return;
    if (!confirm('删除「' + (d.name || '画布') + '」？删了找不回来')) return;
    tx('readwrite', function(st){ return st.delete(id); }).catch(function(){});
    delete DOCS.failedSaves[id];
    DOCS.saveQueue = DOCS.saveQueue.filter(function(item){ return item.rec.id !== id; });
    DOCS.list = DOCS.list.filter(function(x){ return x.id !== id; });
    if (DOCS.activeId === id){
      DOCS.activeId = null;
      var next = null;
      for (var i = 0; i < DOCS.list.length; i++) if (!next || (DOCS.list[i].updatedAt || 0) > (next.updatedAt || 0)) next = DOCS.list[i];
      if (next) applyDoc(next);
      else { S.cells = null; S.base = null; S.gw = 0; S.gh = 0; S.progress = new Uint8Array(0); requestDraw(); renderProgress(); renderList(); }
    }
    renderList();
    toast('已删除');
  }

  function commitFromState(name){
    var rec = {
      id: newId(), name: name || autoName(),
      gw: S.gw, gh: S.gh,
      base: Int16Array.from(S.base),
      progress: new Uint8Array(Math.ceil(S.cells.length / 8)),
      brandId: S.brandId, codeSys: S.codeSys, maxColors: S.maxColors,
      updatedAt: now()
    };
    DOCS.list.push(rec);
    DOCS.activeId = rec.id;
    if (!DOCS.ready) DOCS.pending.push(rec);
    else markDirty();
    renderList();
    saveActive();
  }

  function startRename(row){
    var d = findDoc(row.dataset.id);
    if (!d) return;
    var nameEl = row.querySelector('.dname');
    if (!nameEl) return;
    var inp = document.createElement('input');
    inp.value = d.name || '';
    nameEl.replaceWith(inp);
    inp.focus(); inp.select();
    var done = false;
    function finish(save){
      if (done) return;
      done = true;
      if (save){
        var v = inp.value.trim();
        if (v && v !== d.name){
          d.name = v;
          if (d.id === DOCS.activeId) markDirty();
          else { queueSave(d, -1); flushSaveQueue(); }
        }
      }
      renderList();
      if (save) saveActive();
    }
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
      else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
    });
    inp.addEventListener('blur', function(){ finish(true); });
  }

  /* ---- 事件 ---- */
  var list = $('docList');
  if (list){
    list.addEventListener('click', function(e){
      var del = e.target.closest ? e.target.closest('.ddel') : null;
      var ren = e.target.closest ? e.target.closest('.dren') : null;
      var row = e.target.closest ? e.target.closest('.doc') : null;
      if (del && row){ e.stopPropagation(); deleteDoc(row.dataset.id); return; }
      if (ren && row){ e.stopPropagation(); startRename(row); return; }
      if (row) openDoc(row.dataset.id);
    });
    list.addEventListener('dblclick', function(e){
      var name = e.target.closest ? e.target.closest('.dname') : null;
      if (name && name.closest('.doc')) startRename(name.closest('.doc'));
    });
  }

  /* ---- 钩子：导入 / 新建 / 自动保存 ---- */
  window.__docBeforeImport = function(){ saveActive(); };
  window.__docAfterImport = function(name){ commitFromState(name); };
  window.__markDocDirty = markDirty;
  // IndexedDB owns documents after startup; avoid serializing the whole grid on every edit.
  var origSaveDoc = window.saveDoc;
  window.saveDoc = function(){
    markDirty();
    if (DOCS.ready && !DOCS.db && origSaveDoc) return origSaveDoc.apply(null, arguments);
  };

  ['pushHist', 'resizeTo', 'flipGrid', 'applyLimit', 'buildPalette', 'installDoc', 'undo', 'redo'].forEach(function(key){
    var original = window[key];
    if (typeof original !== 'function') return;
    window[key] = function(){
      var result = original.apply(null, arguments);
      if (result !== false) markDirty();
      return result;
    };
  });

  var origNewBlank = window.newBlank;
  if (typeof origNewBlank === 'function'){
    window.newBlank = function(w, h){
      return createDoc(w, h);
    };
  }
  var origDraw = window.requestDraw;
  if (typeof origDraw === 'function'){
    window.requestDraw = function(){
      return origDraw.apply(null, arguments);
    };
  }
  var origSaveProgress = window.saveProgress;
  if (typeof origSaveProgress === 'function'){
    window.saveProgress = function(){
      if (DOCS.ready && DOCS.activeId){
        var d = activeDoc();
        if (d){ d.progress = Uint8Array.from(S.progress || []); markDirty(); }
      }
      if (!DOCS.db) return origSaveProgress.apply(null, arguments);
    };
  }

  /* ---- 启动 ---- */
  function boot(){
    openDB().then(function(db){
      DOCS.db = db;
      return tx('readonly', function(st){ return st.getAll(); });
    }).then(function(rows){
      return rows || [];
    }).catch(function(){
      if (window.toast) toast('浏览器本地存储不可用，画布只在本次会话保留');
      return [];
    }).then(function(rows){
      var early = !DOCS.ready && DOCS.pending.length ? snap() : null;
      if (early){
        DOCS.pending = DOCS.pending.map(function(rec){ return rec.id === early.id ? early : rec; });
      }
      DOCS.list = rows;
      DOCS.ready = true;
      var pending = DOCS.pending.splice(0);
      if (pending.length) DOCS.list = DOCS.list.concat(pending);
      if (!rows.length){
        try {
          var raw = legacyDocRaw;
          if (raw){
            var d = JSON.parse(raw);
            if (d && Array.isArray(d.base) && Number.isInteger(d.gw) && Number.isInteger(d.gh) &&
                d.gw >= 1 && d.gw <= 400 && d.gh >= 1 && d.gh <= 400 && d.base.length === d.gw * d.gh){
              var palette = BRANDS[d.brandId || S.brandId];
              var valid = !!palette && d.base.every(function(v){ return Number.isInteger(v) && v >= -1 && v < palette.colors.length; });
              if (valid){
                var migrated = { id: newId(), name: '上次的图纸', gw: d.gw, gh: d.gh,
                  base: Int16Array.from(d.base), progress: legacyProgress(d, legacyProgressRaw),
                  brandId: d.brandId, codeSys: d.codeSys, maxColors: d.maxColors || 0, updatedAt: now() };
                DOCS.list.push(migrated);
                queueSave(migrated, -1);
              }
            }
          }
        } catch (e) {}
      }
      if (pending.length){
        pending.forEach(function(rec){
          queueSave(rec, -1);
        });
        applyDoc(pending[pending.length - 1]);
      } else if (DOCS.list.length){
        DOCS.list.sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); });
        applyDoc(DOCS.list[0]);
      } else if (S.cells){
        commitFromState('画布 1');
      }
      renderList();
      flushSaveQueue();
      setInterval(function(){ if (DOCS.dirty || Object.keys(DOCS.failedSaves).length) saveActive(); }, 1500);
      window.addEventListener('beforeunload', function(){ if (DOCS.dirty || Object.keys(DOCS.failedSaves).length) saveActive(); });
      window.addEventListener('pagehide', saveActive);
      document.addEventListener('visibilitychange', function(){ if (document.hidden) saveActive(); });
    });
  }

  function legacyProgress(d, raw){
    var count = d.gw * d.gh, bytes = Math.ceil(count / 8), empty = new Uint8Array(bytes);
    try {
      if (!Array.isArray(d.cells) || d.cells.length !== count || !raw) return empty;
      var saved = JSON.parse(raw), h = 2166136261;
      h = Math.imul(h ^ d.gw, 16777619);
      h = Math.imul(h ^ d.gh, 16777619);
      for (var i = 0; i < count; i++) h = Math.imul(h ^ (d.cells[i] + 1), 16777619);
      if (saved && saved.patternHash === (h >>> 0).toString(16) && Array.isArray(saved.bitmask) && saved.bitmask.length === bytes){
        return Uint8Array.from(saved.bitmask);
      }
    } catch(e){}
    return empty;
  }
  boot();
})();

<script>
/* [hackone] v1.1 —— 九项增强 */
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var A4W = 1240, A4H = 1754;   // 与 a4Canvas 一致（300dpi A4 的近似像素）

  /* ---------- 通用：新分组 ---------- */
  function mkGroup(key, title, innerHTML){
    var g = document.createElement('div');
    g.className = 'grp';
    g.dataset.g = key;
    g.innerHTML = '<div class="gt"><span>' + title + '</span><i class="chev"></i></div><div class="gb">' + innerHTML + '</div>';
    var h = g.querySelector('.gt');
    var lsKey = 'hc.g.' + key;
    if (localStorage.getItem(lsKey) === '1') g.classList.add('collapsed');
    h.addEventListener('click', function(){
      g.classList.toggle('collapsed');
      try { localStorage.setItem(lsKey, g.classList.contains('collapsed') ? '1' : '0'); } catch(e){}
    });
    return g;
  }

  /* ---------- F5 尺寸换算：挂在「新建画布」下方（原独立模块合并于此） ---------- */
  function pitchMm(){
    var b = paletteOf(S.brandId);
    return b.pitch || 2.6;
  }
  function updateNewCap(){
    var el = $('newCap'); if (!el) return;
    var w = Math.max(1, Math.min(400, parseInt(($('newW') || {}).value, 10) || 32));
    var h = Math.max(1, Math.min(400, parseInt(($('newH') || {}).value, 10) || 32));
    var p = pitchMm();
    var boards = Math.ceil(w / 29) * Math.ceil(h / 29);
    el.innerHTML = '成品约 <b>' + (w * p / 10).toFixed(1) + ' × ' + (h * p / 10).toFixed(1) +
      ' cm</b> · <b>' + (w * h) + '</b> 颗 · ' + boards + ' 块底板（' + p + 'mm 豆）';
  }
  ['newW', 'newH'].forEach(function(id){
    var el = $(id); if (!el) return;
    ['input', 'change'].forEach(function(ev){ el.addEventListener(ev, updateNewCap); });
  });
  if ($('brand')) $('brand').addEventListener('change', updateNewCap);
  updateNewCap();

  /* ---------- F9 性能：增量统计 ---------- */
  function ensureStats(){
    if (!S.cells){ S.boardDone = new Int32Array(0); S.boardTot = new Int32Array(0); S.doneCount = 0; S.doneBoards = {}; return; }
    var bc = boardCols(), br = boardRows();
    if (!S.boardDone || S.boardDone.length !== bc*br){
      S.boardDone = new Int32Array(bc*br);
      S.boardTot = new Int32Array(bc*br);
      S.boardDone.fill(0); S.boardTot.fill(0);
      S.doneCount = 0; S.doneBoards = {};
    }
  }
  window.refreshStats = function(force){
    ensureStats();
    if (!force || !S.cells) return;
    var bc = boardCols();
    S.boardDone.fill(0); S.boardTot.fill(0); S.doneCount = 0; S.doneBoards = {};
    for (var y = 0; y < S.gh; y++) for (var x = 0; x < S.gw; x++){
      var i = y*S.gw + x;
      if (S.cells[i] < 0) continue;
      var b = Math.floor(y/29)*bc + Math.floor(x/29);
      S.boardTot[b]++;
      if (hasProgress(i)){ S.boardDone[b]++; S.doneCount++; }
    }
    for (var k = 0; k < S.boardDone.length; k++) if (S.boardTot[k] && S.boardDone[k] >= S.boardTot[k]) S.doneBoards[k] = 1;
  };
  if (typeof window.installDoc === 'function'){
    var oi = window.installDoc;
    window.installDoc = function(){ var r = oi.apply(null, arguments); S.statsDirty = true; return r; };
  }
  if (typeof window.resizeTo === 'function'){
    var orz = window.resizeTo;
    window.resizeTo = function(){ var r = orz.apply(null, arguments); S.statsDirty = true; return r; };
  }
  if (typeof window.renderProgress === 'function'){
    var orp = window.renderProgress;
    window.renderProgress = function(){
      if (S.statsDirty){ S.statsDirty = false; window.refreshStats(true); }
      return orp.apply(null, arguments);
    };
  }

  var origToggle = window.toggleProgress;
  window.toggleProgress = function(i){
    if (!S.cells || i < 0 || i >= S.cells.length) return;
    if (S.cells[i] < 0){ toast('空格子不用标进度'); return; }
    syncProgress();
    var was = hasProgress(i);
    var byte = i >> 3, bit = 1 << (i & 7);
    S.progress[byte] ^= bit;
    ensureStats();
    var bc = boardCols();
    var b = Math.floor((i / S.gw | 0) / 29) * bc + Math.floor((i % S.gw) / 29);
    if (S.boardDone && S.boardDone.length > b){
      S.boardDone[b] += was ? -1 : 1;
      S.doneCount += was ? -1 : 1;
      if (!was && S.boardTot[b] && S.boardDone[b] >= S.boardTot[b]){
        if (!S.doneBoards) S.doneBoards = {};
        if (!S.doneBoards[b]){ S.doneBoards[b] = 1; onBoardDone(b); }
      }
    }
    saveProgress();
    renderProgress();
    requestDraw();
  };

  function onBoardDone(b){
    var bc = boardCols();
    var no = (b % bc) + Math.floor(b / bc) * bc + 1;
    toast('第 ' + no + ' 块板拼完了 🎉 可以生成进度卡片');
    if (window.__flashBoardCard) window.__flashBoardCard();
  }

  /* ---------- F3 板完成提示 + 进度卡片 ---------- */
  window.shareCard = function(){
    if (!S.cells) { toast('先生成图纸'); return; }
    var bc = boardCols(), br = boardRows();
    refreshStats(true);
    var total = S.used.reduce(function(a, u){ return a + u.c; }, 0);
    var done = S.doneCount || 0;
    var pct = total ? done / total * 100 : 0;
    var W = 900, H = 600;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var c = cv.getContext('2d');
    c.fillStyle = '#f4f6fa'; c.fillRect(0, 0, W, H);
    // 缩略图
    var k = Math.max(1, Math.ceil(Math.max(S.gw, S.gh) / 380));
    var tw = Math.round(S.gw / k), th = Math.round(S.gh / k);
    var tc = document.createElement('canvas'); tc.width = tw; tc.height = th;
    var tx = tc.getContext('2d');
    var img = tx.createImageData(tw, th), d = img.data;
    for (var y = 0; y < th; y++) for (var x = 0; x < tw; x++){
      var si = Math.min(S.gh-1, Math.floor(y*S.gh/th)) * S.gw + Math.min(S.gw-1, Math.floor(x*S.gw/tw));
      var v = S.cells[si], o = (y*tw+x)*4;
      if (v < 0){ d[o]=255; d[o+1]=255; d[o+2]=255; }
      else { var p = S.palette[v]; d[o]=p.rgb[0]; d[o+1]=p.rgb[1]; d[o+2]=p.rgb[2]; }
      d[o+3] = 255;
    }
    tx.putImageData(img, 0, 0);
    c.fillStyle = '#fff';
    c.fillRect(60, 60, 400, 480);
    c.drawImage(tc, 80, 80, 360, 360);
    c.fillStyle = '#8b93a1'; c.font = '20px sans-serif';
    c.fillText(S.gw + ' × ' + S.gh + ' 格 · ' + S.used.length + ' 色', 80, 480);
    // 右栏文字
    c.fillStyle = '#1c1f26'; c.font = 'bold 40px sans-serif';
    c.fillText('拼豆进度', 500, 120);
    c.font = 'bold 120px sans-serif';
    c.fillStyle = '#2f6fed';
    c.fillText(Math.round(pct) + '%', 500, 260);
    c.fillStyle = '#5a626e'; c.font = '24px sans-serif';
    c.fillText('已完成 ' + done + ' / ' + total + ' 颗', 500, 310);
    c.fillText('已完成 ' + Object.keys(S.doneBoards || {}).length + ' / ' + (bc*br) + ' 块板', 500, 350);
    // 进度条
    c.fillStyle = '#e2e6ec'; c.fillRect(500, 400, 320, 14);
    c.fillStyle = '#16a34a'; c.fillRect(500, 400, 320 * pct / 100, 14);
    c.fillStyle = '#8b93a1'; c.font = '18px sans-serif';
    c.fillText(new Date().toLocaleDateString('zh-CN'), 500, 460);
    c.fillText('拼豆图纸工具', 500, 490);
    var a = document.createElement('a');
    a.href = cv.toDataURL('image/png');
    a.download = '拼豆进度_' + Math.round(pct) + '%.png';
    a.click();
    toast('进度卡片已生成');
  };

  /* ---------- F7 拼装 / 熨烫指南 ---------- */
  window.openGuide = function(){
    var old = $('guideModal'); if (old) old.remove();
    var m = document.createElement('div');
    m.id = 'guideModal';
    var bc = boardCols(), br = boardRows();
    m.innerHTML = '<div class="gm-box">' +
      '<div class="gm-h">拼装与熨烫指南<button id="gmClose">✕</button></div>' +
      '<div class="gm-body">' +
      '<h4>1 · 备料</h4><p>按「用量统计」把颜色分装；建议每种色多备 5–10%。' +
      (S.cells ? '本次共 ' + (S.gw*S.gh) + ' 格，' + bc*br + ' 块 29×29 底板。' : '') + '</p>' +
      '<h4>2 · 拼装顺序</h4><p>按板号 1 → ' + (bc*br) + ' 依次拼（行优先：先上排左起）。每块板先拼外框再填内部，拼完立刻检查缺色，避免整张拼完才发现。</p>' +
      '<h4>3 · 熨烫</h4><p>盖一层烘焙纸，熨斗中温（约 150–160℃）、不加水、不开蒸汽，匀速压 20–30 秒至豆子边缘融合；翻面再熨 10–15 秒。压重物冷却 5 分钟再揭纸。</p>' +
      '<h4>4 · 拼接</h4><p>板与板之间按页面底部「相邻：上/下/左/右」的编号对接，先对齐边缘再点熨固定。</p>' +
      '<h4>5 · 常见问题</h4><p>豆子不粘 → 温度不够或时间太短；翘边 → 冷却时没压平；缺色 → 用同色号补，别用相近色顶替。</p>' +
      '</div></div>';
    document.body.appendChild(m);
    $('gmClose').addEventListener('click', function(){ m.remove(); });
    m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
  };

  /* ---------- F6 分享链接 / 图纸文件 ---------- */
  function rle(arr){
    var out = [], prev = arr[0] | 0, n = 1;
    for (var i = 1; i < arr.length; i++){
      var v = arr[i] | 0;
      if (v === prev && n < 60000) n++;
      else { out.push((prev + 1).toString(36) + ':' + n.toString(36)); prev = v; n = 1; }
    }
    out.push((prev + 1).toString(36) + ':' + n.toString(36));
    return out.join('.');
  }
  function unrle(str, len){
    if (!Number.isInteger(len) || len < 1 || len > 160000 || typeof str !== 'string' || str.length > 4000000){
      throw new Error('invalid-size');
    }
    var out = new Int32Array(len), k = 0, segments = str.split('.');
    if (segments.length > len) throw new Error('invalid-rle');
    for (var j = 0; j < segments.length; j++){
      var m = /^([0-9a-z]+):([0-9a-z]+)$/.exec(segments[j]);
      if (!m) throw new Error('invalid-rle');
      var v = parseInt(m[1], 36) - 1, n = parseInt(m[2], 36);
      if (!Number.isSafeInteger(v) || v < -1 || v >= 2048 || !Number.isSafeInteger(n) || n < 1 || n > 60000 || k + n > len){
        throw new Error('invalid-rle');
      }
      out.fill(v, k, k + n);
      k += n;
    }
    if (k !== len) throw new Error('invalid-rle');
    return out;
  }
  function b64url(bytes){
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64url(str){
    var s = str.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  var MAX_PACKED_CODE = 6000000, MAX_PACKED_RAW = 4000000;
  async function readTextBounded(stream, maxBytes){
    if (!stream) throw new Error('missing-body');
    var reader = stream.getReader(), chunks = [], size = 0;
    try {
      while (true){
        var part = await reader.read();
        if (part.done) break;
        size += part.value.byteLength;
        if (size > maxBytes){ await reader.cancel(); throw new Error('document-too-large'); }
        chunks.push(part.value);
      }
    } finally { reader.releaseLock(); }
    var bytes = new Uint8Array(size), offset = 0;
    chunks.forEach(function(chunk){ bytes.set(chunk, offset); offset += chunk.byteLength; });
    return new TextDecoder('utf-8', { fatal:true }).decode(bytes);
  }
  async function packDoc(){
    var raw = rle(S.base) + '|' + [S.gw, S.gh, S.brandId, S.codeSys, S.maxColors].join(',');
    if (window.CompressionStream){
      try {
        var bytes = new TextEncoder().encode(raw);
        var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        var buf = new Uint8Array(await new Response(stream).arrayBuffer());
        return 'z' + b64url(buf);
      } catch (e) { /* 退回未压缩 */ }
    }
    return 'r' + b64url(new TextEncoder().encode(raw));
  }
  async function unpackDoc(code){
    if (typeof code !== 'string' || code.length < 2 || code.length > MAX_PACKED_CODE){
      throw new Error('document-too-large');
    }
    var raw;
    if (code[0] === 'z'){
      var bytes = unb64url(code.slice(1));
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      raw = await readTextBounded(stream, MAX_PACKED_RAW);
    } else if (code[0] === 'r') {
      var plain = unb64url(code.slice(1));
      if (plain.byteLength > MAX_PACKED_RAW) throw new Error('document-too-large');
      raw = new TextDecoder('utf-8', { fatal:true }).decode(plain);
    } else { throw new Error('invalid-encoding'); }
    var k = raw.lastIndexOf('|');
    if (k < 1) throw new Error('invalid-document');
    var r = raw.slice(0, k), meta = raw.slice(k + 1).split(',');
    var w = +meta[0], h = +meta[1];
    if (!Number.isInteger(w) || !Number.isInteger(h) || w < 1 || h < 1 || w > 400 || h > 400 || w*h > 160000){
      throw new Error('invalid-size');
    }
    var brand = BRANDS[meta[2]];
    if (!brand) throw new Error('invalid-brand');
    var base = unrle(r, w * h);
    var max = meta[4] ? +meta[4] : 0;
    if (!Number.isInteger(max) || max < 0 || max > brand.colors.length) throw new Error('invalid-limit');
    for (var i = 0; i < base.length; i++) if (base[i] >= brand.colors.length) throw new Error('invalid-color');
    return { w: w, h: h, base: base, brand: meta[2], code: meta[3], max: max };
  }
  function applyPacked(p, name){
    if (!p || !Number.isInteger(p.w) || !Number.isInteger(p.h) || p.w < 1 || p.h < 1 || p.w > 400 || p.h > 400 ||
        p.w * p.h > 160000 || !p.base || p.base.length !== p.w * p.h){
      throw new Error('invalid-document');
    }
    if (p.brand && !BRANDS[p.brand]) throw new Error('invalid-brand');
    var palette = BRANDS[p.brand || S.brandId];
    for (var i = 0; i < p.base.length; i++){
      if (!Number.isInteger(p.base[i]) || p.base[i] < -1 || p.base[i] >= palette.colors.length){
        throw new Error('invalid-color');
      }
    }
    if (p.max != null && (!Number.isInteger(p.max) || p.max < 0 || p.max > palette.colors.length)){
      throw new Error('invalid-limit');
    }
    if (window.__docBeforeImport) window.__docBeforeImport();
    S.gw = p.w; S.gh = p.h; S.base = p.base;
    if (p.brand) S.brandId = p.brand;
    if (p.code) S.codeSys = p.code;
    S.maxColors = p.max || 0;
    if ($('brand')) $('brand').value = S.brandId;
    colourSystemOptions();
    buildPalette({ remap:false });
    installDoc(p.w, p.h, p.base);
    resetProgress();
    fit();
    if (window.__docAfterImport) window.__docAfterImport(name || '分享的图纸');
  }
  /* 短链服务（Cloudflare Worker + KV）：链接只有 40 来个字符，微信/QQ 能直接发；
     没网时自动退回 #d= 长链接，再不行退回 .pinda.json 文件。 */
  var SHARE_API = 'https://pinda-share.tianqi689.workers.dev';
  var SHARE_SITE = 'https://hack.liutingqiu.xyz';

  async function copyText(txt){
    if (navigator.clipboard && navigator.clipboard.writeText){
      try { await navigator.clipboard.writeText(txt); return true; } catch(e){}
    }
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch(e){ return false; }
  }

  window.copyShareLink = async function(){
    if (!S.cells) { toast('先生成图纸'); return; }
    var code = await packDoc();
    var kb = Math.max(1, Math.round(code.length / 1024));
    var fail = '网络不通';
    toast('正在生成分享链接…');
    try {
      var r = null;
      for (var attempt = 0; attempt < 2; attempt++){
        try {
          r = await fetch(SHARE_API + '/api/save', { method: 'POST', body: code });
          if (r.ok) break;
          fail = r.status === 413 ? '图纸太大（超过 400 KB）' : '分享服务返回 ' + r.status;
          if (r.status === 413) break;
        } catch(e){ r = null; fail = '网络不通'; }
        await new Promise(function(res){ setTimeout(res, 500); });
      }
      if (r && r.ok){
        var j = await r.json();
        if (j && j.id){
          var shortUrl = SHARE_SITE + '/#s=' + j.id;
          var copied = await copyText(shortUrl);
          showLinkModal(shortUrl, (copied ? '短链接已生成并复制（' : '短链接已生成（') + shortUrl.length +
            ' 字符，180 天内有效）' + (copied ? '' : '：复制下面这条发给对方'));
          return;
        }
      }
    } catch(e){ /* 没网 / 服务不可用，走兜底 */ }

    var url = SHARE_SITE + '/#d=' + code;
    if (url.length <= 4000){
      var ok = await copyText(url);
      showLinkModal(url, (ok ? '已复制到剪贴板（' : '请手动复制（') + url.length + ' 字符，离线直连链接）');
      return;
    }
    var data = { v: 1, w: S.gw, h: S.gh, b: S.brandId, c: S.codeSys, m: S.maxColors, r: rle(S.base) };
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    a.download = '拼豆图纸_' + S.gw + 'x' + S.gh + '.pinda.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast(fail + '，已导出 .pinda.json（' + kb + ' KB），用「打开图纸」可以再打开');
  };

  async function loadShareHash(){
    var sm = /(?:^|[#&])s=([A-Za-z0-9_-]{4,16})/.exec(location.hash || '');
    if (sm){
      try {
        var resp = await fetch(SHARE_API + '/api/get/' + sm[1]);
        if (!resp.ok) throw new Error('miss');
        var length = +(resp.headers.get('content-length') || 0);
        if (length > MAX_PACKED_CODE) throw new Error('too-large');
        var code = (await readTextBounded(resp.body, MAX_PACKED_CODE)).trim();
        var sp = await unpackDoc(code);
        applyPacked(sp, '分享的图纸');
        try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
        toast('已打开分享的图纸');
        return true;
      } catch(e){ toast('分享链接已失效或网络不通'); return false; }
    }
    var m = /(?:^|[#&])d=([^&]+)/.exec(location.hash || '');
    if (!m) return false;
    try {
      var p = await unpackDoc(decodeURIComponent(m[1]));
      applyPacked(p, '分享的图纸');
      try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
      toast('已打开分享的图纸');
      return true;
    } catch(e){ toast('分享链接解析失败'); return false; }
  }
  window.openDocFile = function(){ $('docFile').click(); };
  document.addEventListener('DOMContentLoaded', function(){});
  function bindDocFile(){
    var inp = $('docFile');
    if (!inp) return;
    inp.addEventListener('change', function(e){
      var f = e.target.files[0]; if (!f) return;
      if (f.size > MAX_PACKED_RAW){ toast('图纸文件过大，无法安全读取'); e.target.value = ''; return; }
      var r = new FileReader();
      r.onload = function(){
        try {
          var d = JSON.parse(r.result);
          var p = { w: d.w, h: d.h, base: d.r ? unrle(d.r, d.w*d.h) : d.base, brand: d.b, code: d.c, max: d.m };
          applyPacked(p, (f.name || '图纸文件').replace(/\.(pinda\.)?json$/i, ''));
          toast('已打开图纸文件');
        } catch(err){ toast('文件读取失败'); }
      };
      r.readAsText(f);
      e.target.value = '';
    });
  }

  function showLinkModal(url, note){
    var old = $('linkModal'); if (old) old.remove();
    var m = document.createElement('div');
    m.id = 'linkModal';
    m.innerHTML = '<div class="lm-box"><div class="lm-h">分享链接<button id="lmClose">✕</button></div>' +
      '<div class="lm-body"><textarea id="lmTa" readonly></textarea>' +
      '<div class="cap">' + (note || '发给对方，打开就是这张图纸') + '</div>' +
      (note ? '' : '') + '</div></div>';
    document.body.appendChild(m);
    var ta = $('lmTa'); ta.value = url; ta.focus(); ta.select();
    $('lmClose').addEventListener('click', function(){ m.remove(); });
    m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
  }
  /* ---------- F1/F2/F8 A4 增强 ---------- */
  var A4PX = 1240; // 页面像素宽，对应 210mm
  function mmPx(mm){ return Math.round(mm * A4PX / 210); }
  function scaleBar(c, x, y){
    var w = mmPx(100);
    c.strokeStyle = '#1c1f26'; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x, y); c.lineTo(x + w, y);
    c.moveTo(x, y - 8); c.lineTo(x, y + 8);
    c.moveTo(x + w, y - 8); c.lineTo(x + w, y + 8);
    c.stroke();
    c.fillStyle = '#5a626e'; c.font = '16px sans-serif'; c.textAlign = 'center';
    c.fillText('10 cm（按 100% 打印，勿缩放）', x + w/2, y + 28);
    c.textAlign = 'left';
  }
  function boardPaletteDraw(c, bx, by, x, y, maxW, maxRows){
    var sx = bx * 29, sy = by * 29;
    var cols = Math.min(29, S.gw - sx), rows = Math.min(29, S.gh - sy);
    var map = new Map();
    for (var yy = 0; yy < rows; yy++) for (var xx = 0; xx < cols; xx++){
      var v = S.cells[(sy+yy)*S.gw + sx+xx];
      if (v < 0) continue;
      map.set(v, (map.get(v) || 0) + 1);
    }
    var list = Array.from(map.entries()).sort(function(a, b){ return b[1] - a[1]; });
    if (!list.length) return;
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#5a626e'; c.font = 'bold 14px sans-serif';
    c.fillText('本板用色 ' + list.length + ' 色', x, y - 10);
    var cx = x, cy = y, rowH = 24, row = 0, shown = 0;
    c.font = '13px sans-serif';
    for (var i = 0; i < list.length; i++){
      var p = S.palette[list[i][0]], n = list[i][1];
      var label = p.code + ' ×' + n;
      var w = 20 + c.measureText(label).width + 12;
      if (cx + w > x + maxW){
        if (row + 1 >= maxRows) break;
        row++; cx = x; cy += rowH;
      }
      c.fillStyle = p.hex; c.fillRect(cx, cy, 15, 15);
      c.strokeStyle = '#00000033'; c.lineWidth = 1; c.strokeRect(cx + .5, cy + .5, 14, 14);
      c.fillStyle = '#1c1f26'; c.fillText(label, cx + 20, cy + 12);
      cx += w; shown++;
    }
    if (shown < list.length){
      c.fillStyle = '#8b93a1';
      c.fillText('+' + (list.length - shown) + ' 色（见总表）', cx + 4, cy + 12);
    }
  }
  var origBoard = window.renderA4Board;
  window.renderA4Board = function(bx, by, page, total){
    var cv = origBoard(bx, by, page, total);
    var c = cv.getContext('2d');
    var cols = Math.min(29, S.gw - bx*29), rows = Math.min(29, S.gh - by*29);
    var areaW = A4W - 140 - 40, areaH = A4H - 310;
    var cs = Math.max(10, Math.floor(Math.min(areaW / cols, areaH / rows)));
    var oy = 138 + Math.floor((areaH - rows*cs) / 2);
    var y0 = Math.min(1588, oy + rows*cs + 58);
    boardPaletteDraw(c, bx, by, 70, y0, A4W - 140, 2);
    scaleBar(c, 70, 1614);
    return cv;
  };
  var origOverview = window.renderA4Overview;
  window.renderA4Overview = function(page, total){
    var cv = origOverview(page, total);
    var c = cv.getContext('2d');
    scaleBar(c, 70, 1614);
    return cv;
  };

  /* ---------- F4 拍照核验 ---------- */
  var verifyHTML = '' +
    '<div class="row2"><span class="lb">拍照核验</span><button id="vPick" class="sm">选照片</button></div>' +
    '<div class="cap" id="vOut">把拼好的板拍正、裁到图纸边缘，再选照片</div>' +
    '<input type="file" id="vFile" accept="image/*" capture="environment" hidden>';
  var vCard = document.createElement('div');
  vCard.className = 'grp';
  vCard.dataset.g = 'verify';
  vCard.innerHTML = '<div class="gt"><span>拍照核验</span><i class="chev"></i></div><div class="gb">' + verifyHTML + '</div>';
  var right = $('right');
  var useGrp = right.querySelector('.grp[data-g="use"]');
  right.insertBefore(vCard, useGrp || null);
  (function bindCollapse(){
    var h = vCard.querySelector('.gt'), key = 'hc.g.verify';
    if (localStorage.getItem(key) === '1') vCard.classList.add('collapsed');
    h.addEventListener('click', function(){
      vCard.classList.toggle('collapsed');
      try { localStorage.setItem(key, vCard.classList.contains('collapsed') ? '1' : '0'); } catch(e){}
    });
  })();

  $('vPick').addEventListener('click', function(){ $('vFile').click(); });
  $('vFile').addEventListener('change', function(e){
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){ verifyPhoto(r.result); };
    r.readAsDataURL(f);
  });
  window.verifyPhoto = function(src){
    if (!S.cells){ toast('先生成图纸'); return; }
    var img = new Image();
    img.onload = function(){
      var gw = S.gw, gh = S.gh;
      var SS = 6;
      var cv = document.createElement('canvas'); cv.width = gw*SS; cv.height = gh*SS;
      var c = cv.getContext('2d');
      c.drawImage(img, 0, 0, gw*SS, gh*SS);
      var data;
      try { data = c.getImageData(0, 0, gw*SS, gh*SS).data; }
      catch(e){ toast('照片读取失败'); return; }
      var used = S.used.map(function(u){ return { i: u.i, lab: S.palette[u.i].lab }; });
      var mark = [], wrong = [], emptyN = 0, i = 0, total = gw*gh, skipWrong = false;
      toast('正在核验，请稍候…');
      function step(){
        var budget = Date.now() + 24;
        while (i < total && Date.now() < budget){
          var dv = S.cells[i];
          if (dv < 0){ i++; continue; }
          var cx = i % gw, cy = (i / gw) | 0;
          var r = 0, g = 0, b = 0, cnt = 0;
          for (var sy = 0; sy < 2; sy++) for (var sx = 0; sx < 2; sx++){
            var px = Math.min(gw*SS-1, (cx + 0.28 + sx*0.44) * SS | 0);
            var py = Math.min(gh*SS-1, (cy + 0.28 + sy*0.44) * SS | 0);
            var oo = (py*gw*SS + px) * 4;
            r += data[oo]; g += data[oo+1]; b += data[oo+2]; cnt++;
          }
          r = Math.round(r/cnt); g = Math.round(g/cnt); b = Math.round(b/cnt);
          var lab = srgbToLab([r, g, b]);
          if (deltaE2000(lab, S.palette[dv].lab) < 12){ mark.push(i); i++; continue; }
          if (r > 235 && g > 235 && b > 235){ emptyN++; i++; continue; }
          if (skipWrong){ emptyN++; i++; continue; }
          var hit = -1, best = 1e9;
          for (var k = 0; k < used.length; k++){
            var d2 = deltaE2000(lab, used[k].lab);
            if (d2 < best){ best = d2; hit = used[k].i; }
            if (best < 6) break;
          }
          if (best < 10 && hit !== dv) wrong.push(i); else emptyN++;
          if (wrong.length > 4000) skipWrong = true;
          i++;
        }
        if (i < total){ requestAnimationFrame(step); return; }
        syncProgress();
        mark.forEach(function(idx){ S.progress[idx >> 3] |= (1 << (idx & 7)); });
        refreshStats(true); saveProgress(); renderProgress();
        S.verifyWrong = new Set(wrong);
        clearTimeout(window.__vwT);
        window.__vwT = setTimeout(function(){ S.verifyWrong = null; requestDraw(); }, 8000);
        requestDraw();
        $('vOut').innerHTML = '已拼 <b>' + mark.length + '</b> 格 · 疑似错位 <b>' + wrong.length +
          '</b> 格（红框标出 8 秒）· 未拼 ' + emptyN + ' 格';
        toast('核验完成：' + mark.length + ' 格已拼');
      }
      step();
    };
    img.onerror = function(){ toast('照片加载失败'); };
    img.src = src;
  };


  var origDrawFn = window.draw;
  window.draw = function(){
    origDrawFn.apply(null, arguments);
    if (!S.verifyWrong || !S.verifyWrong.size || !S.cells) return;
    var cv = document.getElementById('grid');
    if (!cv || cv.hidden) return;
    var cs = S.cell, W = S.gw * cs;
    var dpr = cv.width / W;
    var c = cv.getContext('2d');
    c.save();
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.strokeStyle = '#e11d48'; c.lineWidth = 1.5;
    S.verifyWrong.forEach(function(i){
      var x = i % S.gw, y = (i / S.gw) | 0;
      c.strokeRect(x*cs + 1, y*cs + 1, cs - 2, cs - 2);
    });
    c.restore();
  };
  /* ---------- 导出区按钮 ---------- */
  var dock = $('dock');
  if (dock){
    var row = document.createElement('div');
    row.className = 'row2';
    row.style.marginTop = '6px';
    row.innerHTML = '<button id="btnShareCard" class="sm">进度卡片</button><button id="btnGuide" class="sm">拼装指南</button>';
    var row2 = document.createElement('div');
    row2.className = 'row2';
    row2.innerHTML = '<button id="btnShareLink" class="sm" title="生成短链接，微信/QQ 直接发">分享链接</button>' +
      '<button id="btnOpenDoc" class="sm tip-up" data-tip="需要 .json 图纸文件">打开图纸</button>';
    var docInp = document.createElement('input');
    docInp.type = 'file'; docInp.id = 'docFile'; docInp.accept = '.json,application/json'; docInp.hidden = true;
    dock.appendChild(docInp);
    dock.appendChild(row);
    dock.appendChild(row2);
    $('btnShareCard').addEventListener('click', window.shareCard);
    $('btnGuide').addEventListener('click', window.openGuide);
    $('btnShareLink').addEventListener('click', window.copyShareLink);
    $('btnOpenDoc').addEventListener('click', function(){ $('docFile').click(); });
    bindDocFile();
  }

  /* ---------- 启动 ---------- */
  setTimeout(function(){ loadShareHash(); }, 400);
  setTimeout(function(){ refreshStats(); renderProgress(); }, 900);
})();
</script>

<div id="drawerMask" aria-hidden="true"></div>
<script>
/* [hackone] 工作区收起（横屏）/ 抽屉（竖屏）+ 双指缩放 */
(function(){
  var body = document.body;
  var mask = document.getElementById('drawerMask');
  var L = document.getElementById('sideToggle');
  var R = document.getElementById('rightToggle');
  var mq = window.matchMedia('(max-width:900px)');

  function isDrawer(){ return mq.matches; }
  function store(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }

  function isFitted(){
    var v = document.getElementById('view'), cv = document.getElementById('grid');
    if (!v || !cv || !cv.width) return false;
    return cv.width <= v.clientWidth + 1 && cv.height <= v.clientHeight + 1;
  }
  function refit(){
    try { if (typeof window.fit === 'function') window.fit(); } catch (e) {}
  }
  function afterLayout(){
    requestAnimationFrame(function(){
      try { if (window.requestDraw) requestDraw(); } catch (e) {}
      var v = document.getElementById('view'), cv = document.getElementById('grid');
      if (!v || !cv || !cv.width) return;
      if (cv.width <= v.clientWidth) v.scrollLeft = 0;
      if (cv.height <= v.clientHeight) v.scrollTop = 0;
    });
  }

  function sync(){
    if (isDrawer()){
      if (L) L.setAttribute('aria-expanded', body.classList.contains('drawer-left') ? 'true' : 'false');
      if (R) R.setAttribute('aria-expanded', body.classList.contains('drawer-right') ? 'true' : 'false');
      if (L) L.classList.remove('off');
      if (R) R.classList.remove('off');
      return;
    }
    var hl = body.classList.contains('hide-left'), hr = body.classList.contains('hide-right');
    if (L){ L.setAttribute('aria-expanded', hl ? 'false' : 'true'); L.classList.toggle('off', hl); }
    if (R){ R.setAttribute('aria-expanded', hr ? 'false' : 'true'); R.classList.toggle('off', hr); }
  }

  function applySaved(){
    if (isDrawer()){
      body.classList.remove('hide-left','hide-right');
    } else {
      body.classList.toggle('hide-left', load('hc.panel.left','1') === '0');
      body.classList.toggle('hide-right', load('hc.panel.right','1') === '0');
    }
    sync();
  }

  function toggleCollapse(side){
    var wasFitted = isFitted();
    var hidden = body.classList.toggle('hide-' + side);
    store('hc.panel.' + side, hidden ? '0' : '1');
    sync();
    if (wasFitted) setTimeout(refit, 80); else afterLayout();
  }

  function closeDrawers(){ body.classList.remove('drawer-left','drawer-right'); sync(); }
  function toggleDrawer(side){
    var cls = 'drawer-' + side, on = body.classList.contains(cls);
    body.classList.remove('drawer-left','drawer-right');
    if (!on) body.classList.add(cls);
    sync();
  }

  if (L) L.addEventListener('click', function(){ isDrawer() ? toggleDrawer('left') : toggleCollapse('left'); });
  if (R) R.addEventListener('click', function(){ isDrawer() ? toggleDrawer('right') : toggleCollapse('right'); });
  if (mask) mask.addEventListener('click', closeDrawers);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDrawers(); });

  var onChange = function(){
    var wasFitted = isFitted();
    closeDrawers(); applySaved();
    if (wasFitted) setTimeout(refit, 80); else afterLayout();
  };
  if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);

  applySaved();
  afterLayout();

  var VIEW = document.getElementById('view');
  if (!VIEW) return;
  var pts = new Map(), pinch = null;
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
  function mid(a, b){ return { x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 }; }

  VIEW.addEventListener('pointerdown', function(e){
    if (e.pointerType !== 'touch') return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size === 2 && typeof S !== 'undefined' && S.cells){
      var p = Array.from(pts.values());
      pinch = { d: Math.max(1, dist(p[0], p[1])), cell: S.cell, m: mid(p[0], p[1]),
                sl: VIEW.scrollLeft, st: VIEW.scrollTop };
      S.pinching = true;
      if (typeof window.cancelStroke === 'function') window.cancelStroke();
      e.preventDefault();
    }
  }, { capture:true, passive:false });

  VIEW.addEventListener('pointermove', function(e){
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (!pinch || pts.size < 2) return;
    var p = Array.from(pts.values()).slice(0, 2);
    var d = Math.max(1, dist(p[0], p[1]));
    var m = mid(p[0], p[1]);
    var target = pinch.cell * (d / pinch.d);
    try {
      if (typeof window.animateZoom === 'function') window.animateZoom(target, m.x, m.y);
      else if (typeof setCellSize === 'function') setCellSize(target);
    } catch (err) {}
    VIEW.scrollLeft = pinch.sl - (m.x - pinch.m.x);
    VIEW.scrollTop  = pinch.st - (m.y - pinch.m.y);
    e.preventDefault();
  }, { capture:true, passive:false });

  function end(e){
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size < 2){
      if (pinch) window.__pinchGuard = Date.now();
      pinch = null;
      if (typeof S !== 'undefined') S.pinching = false;
    }
  }
  window.addEventListener('pointerup', end, true);
  window.addEventListener('pointercancel', end, true);
})();
</script>
</body>
</html>
