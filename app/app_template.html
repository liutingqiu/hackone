<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼豆图纸工具 · 像素图转色号网格</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOSAyMCIgd2lkdGg9IjE5IiBoZWlnaHQ9IjIwIiBzaGFwZS1yZW5kZXJpbmc9ImNyaXNwRWRnZXMiPjxzdHlsZT4ua3tmaWxsOiMxNDE3MWN9QG1lZGlhIChwcmVmZXJzLWNvbG9yLXNjaGVtZTogZGFyayl7Lmt7ZmlsbDojZmZmZmZmfX08L3N0eWxlPjxwYXRoIGNsYXNzPSJrIiBkPSJNMSAwaDJ2MWgtMnpNNSAwaDJ2MWgtMnpNMCAxaDN2MWgtM3pNNCAxaDEydjFoLTEyek0xIDJoMnYxaC0yek01IDJoMnYxaC0yek0xNiAyaDJ2MWgtMnpNMSAzaDJ2MWgtMnpNMTggM2gxdjFoLTF6TTEgNGgydjFoLTJ6TTEyIDRoMnYxaC0yek0xOCA0aDF2MWgtMXpNMSA1aDE0djFoLTE0ek0xOCA1aDF2MWgtMXpNMSA2aDJ2MWgtMnpNMTIgNmgydjFoLTJ6TTE4IDZoMXYxaC0xek0xIDdoMnYxaC0yek0xOCA3aDF2MWgtMXpNMSA4aDJ2MWgtMnpNNSA4aDJ2MWgtMnpNMTYgOGgydjFoLTJ6TTEgOWgydjFoLTJ6TTQgOWgxMnYxaC0xMnpNMSAxMGgydjFoLTJ6TTUgMTBoMnYxaC0yek0xIDExaDJ2MWgtMnpNMSAxMmgydjFoLTJ6TTEgMTNoMnYxaC0yek0xIDE0aDJ2MWgtMnpNMSAxNWgydjFoLTJ6TTEgMTZoMnYxaC0yek0xIDE3aDJ2MWgtMnpNMCAxOGg0djFoLTR6TTEgMTloMnYxaC0yeiIvPjwvc3ZnPg==">
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --line:#e2e6ec; --ink:#1c1f26; --ink2:#5a626e; --ink3:#8b93a1;
    --accent:#2f6fed; --accent2:#eaf1ff; --warn:#c2410c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    height:100%;display:grid;
    grid-template-columns:300px minmax(0,1fr) 302px;
    gap:0;
  }

  /* ---------------- 左栏 ---------------- */
  aside{background:var(--panel);overflow-y:auto;min-height:0}
  #side{border-right:1px solid var(--line);padding:0 0 22px}
  .sec{padding:13px 14px;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:0}
  .h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
     letter-spacing:.06em;color:var(--ink3);margin-bottom:10px}
  .h .n{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;
        background:var(--accent2);color:var(--accent);font-size:10px}
  .row{display:flex;align-items:center;gap:7px;margin-top:7px}
  .row label{color:var(--ink2);font-size:12px;white-space:nowrap}
  .chk{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px;
       cursor:pointer;user-select:none;margin-top:7px}
  input[type=number],select{
    flex:1;min-width:0;padding:5px 7px;border:1px solid var(--line);border-radius:6px;
    background:#fff;color:var(--ink);font:inherit;font-size:12px;outline:none;
  }
  input[type=number]:focus,select:focus{border-color:var(--accent)}
  input[type=number]{width:62px;flex:0 0 auto}
  button{
    padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;
    color:var(--ink);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  button:hover{background:#f6f8fb;border-color:#cfd6e0}
  button:active{transform:translateY(1px)}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  button.pri:hover{background:#2560d8}
  .seg{display:flex;gap:0;flex:1}
  .seg button{flex:1;border-radius:0;margin-left:-1px}
  .seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
  .seg button:last-child{border-radius:0 6px 6px 0}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;position:relative;z-index:1}
  .hint{color:var(--ink3);font-size:11.5px;line-height:1.6;margin-top:7px}
  .hint b{color:var(--ink2)}
  #drop{
    border:1.5px dashed #c8d0da;border-radius:8px;padding:15px 10px;text-align:center;
    color:var(--ink3);font-size:12px;cursor:pointer;background:#fafbfd;line-height:1.7;
  }
  #drop:hover,#drop.over{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
  #srcInfo{margin-top:8px}
  #sizeInfo{margin-top:9px;padding:8px 9px;background:#f6f8fb;border-radius:6px;
            font-size:11.5px;color:var(--ink2);line-height:1.7}
  #sizeInfo b{color:var(--ink)}
  #palInfo{color:var(--ink3);font-size:11.5px;margin-top:8px;line-height:1.65}
  .pchip{width:16px;height:16px;border-radius:4px;border:1px solid #0002;display:inline-block;
         background:repeating-conic-gradient(#e9ecf1 0 25%,#fff 0 50%) 0/8px 8px;flex:0 0 16px}
  #paintCode{font-size:12px;font-variant-numeric:tabular-nums}
  #paintRow{cursor:pointer;border-radius:6px;padding:3px 4px;margin-left:-4px}
  #paintRow:hover{background:#f6f8fb}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .val{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}

  /* 工具栏 4×2 */
  .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .tools button{padding:6px 2px;font-size:11.5px;border-radius:6px}
  .tools button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 9 宫格对齐锚点 */
  .anchor{display:grid;grid-template-columns:repeat(3,18px);grid-template-rows:repeat(3,18px);gap:2px;
          padding:3px;border:1px solid var(--line);border-radius:6px;background:#f6f8fb}
  .anchor button{width:18px;height:18px;padding:0;border-radius:3px;background:#fff;border:1px solid #d7dde6}
  .anchor button:hover{background:var(--accent2);border-color:var(--accent)}
  .anchor button.on{background:var(--accent);border-color:var(--accent)}
  .anchor button.on::after{content:"";display:block;width:5px;height:5px;margin:auto;
                           background:#fff;border-radius:1px}

  /* ---------------- 中间 ---------------- */
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  #bar{
    display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);flex:0 0 auto;
  }
  #bar b{color:var(--ink)}
  #bar .sp{flex:1}
  #barPos{font-variant-numeric:tabular-nums;color:var(--ink3);min-width:120px;text-align:right}
  /* [hackone] 画布上方模式条 */
  #modebar{
    display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);flex:0 0 auto;
  }
  #modeHint{color:var(--ink3);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tools .tsep{width:1px;align-self:stretch;background:var(--line);margin:2px 6px}
  #tools button[data-t="mark"].on{background:#e9f7ef;border-color:#a7d8ba;color:#15803d}
  #view{flex:1;overflow:auto;display:grid;place-items:center;padding:20px;min-height:0}
  #grid{image-rendering:pixelated;background:#fff;box-shadow:0 1px 10px #0006;cursor:crosshair}
  /* [hackone] 拖拽平移：查看工具显示抓手，拖动中显示抓握 */
  #grid.grab{cursor:grab}
  #view.panning, #view.panning #grid{cursor:grabbing}
  #view.spacepan, #view.spacepan #grid{cursor:grab}
  #empty{text-align:center;color:var(--ink3);font-size:13px;line-height:2}
  #empty .big{font-size:17px;font-weight:700;color:var(--ink2);margin-bottom:4px}

  /* ---------------- 右栏 ---------------- */
  #right{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #credit{margin-top:auto;flex:0 0 auto;padding:10px 14px 12px;text-align:right;
          font-size:11px;color:var(--ink3);letter-spacing:.02em;line-height:1.4}
  #credit span{margin:0 5px;color:#cfd6e0}
  #credit a{color:inherit;text-decoration:none}
  #credit a:hover{color:var(--ink2);text-decoration:underline;text-underline-offset:2px}
  a.iconbtn{display:grid;place-items:center;text-decoration:none}
  #insp{padding:12px 13px;border-bottom:1px solid var(--line);flex:0 0 auto}
  #inspBody .sw{width:100%;height:34px;border-radius:6px;border:1px solid #0002;margin-bottom:8px}
  #inspBody .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;
                color:var(--ink2);padding:2px 0}
  #inspBody .kv b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
  #xbrand{margin-top:9px;border-top:1px dashed var(--line);padding-top:7px}
  #xbrand .t{font-size:10.5px;color:var(--ink3);margin-bottom:4px;letter-spacing:.04em}
  #xbrand .r{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);padding:2px 0}
  #xbrand .r b{color:var(--ink);font-variant-numeric:tabular-nums}
  #xbrand .r.cur span:first-child{color:var(--accent);font-weight:700}
  #xbrand .r.cur b{color:var(--accent)}
  .alias{margin-top:6px;font-size:11px;color:var(--warn);background:#fff7ed;
         border:1px solid #fed7aa;border-radius:5px;padding:4px 6px;line-height:1.55}

  /* 相近色 */
  #simWrap{border-bottom:1px solid var(--line);padding:9px 13px 11px;flex:0 0 auto}
  #simHead{font-size:10.5px;color:var(--ink3);letter-spacing:.04em;margin-bottom:6px;
           display:flex;justify-content:space-between;gap:8px}
  #simHead b{color:var(--ink);font-size:11.5px}
  #sim .r{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:5px;cursor:pointer}
  #sim .r:hover{background:var(--accent2)}
  #sim .r .c{width:16px;height:16px;border-radius:4px;border:1px solid #0002;flex:0 0 16px}
  #sim .r .code{font-weight:600;font-size:11.5px;font-variant-numeric:tabular-nums}
  #sim .r .n{font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
  #sim .r .d{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-left:auto}
  #sim .tip{font-size:11px;color:var(--ink3);line-height:1.6}

  /* [hackone] 拼装进度 */
  #progWrap{padding:9px 13px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
  #progHead{display:flex;justify-content:space-between;align-items:center;gap:8px;
            font-size:11px;color:var(--ink3);letter-spacing:.03em}
  #progHead b{color:var(--ink);font-size:11.5px;font-variant-numeric:tabular-nums}
  #progBar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
  #progFill{display:block;height:100%;width:0;background:#16a34a;border-radius:999px}
  #progBoards{margin-top:6px;display:flex;flex-direction:column;gap:2px;max-height:150px;overflow-y:auto}
  .pb{display:grid;grid-template-columns:1fr 70px 38px;align-items:center;gap:6px;
      font-size:10.5px;color:var(--ink3)}
  .pb i{display:block;height:4px;background:var(--line);border-radius:999px;overflow:hidden}
  .pb i b{display:block;height:100%;background:#16a34a;border-radius:999px}
  .pb span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
  #useWrap{flex:1;overflow-y:auto;min-height:0}
  #use{padding:5px 7px 14px}
  .u{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:5px;cursor:pointer}
  .u:hover{background:#f6f8fa}
  .u.sel{background:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent)}
  .u .c{width:19px;height:19px;border-radius:4px;border:1px solid #0002;flex:0 0 19px}
  .u .code{font-weight:600;font-size:11.5px;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:34px}
  .u .x{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .u .x b{color:var(--ink);font-weight:600}
  .u .pct{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .u .rep{padding:2px 7px;font-size:10px;border-radius:4px;color:var(--ink2);flex:0 0 auto}
  .u .rep:hover{color:var(--accent);border-color:var(--accent);background:var(--accent2)}
  #useHead{padding:9px 13px 6px;font-size:11px;color:var(--ink3);
           display:flex;justify-content:space-between;align-items:center;gap:7px}
  #useHead b{margin-left:auto}
  #copyPurchase{padding:3px 6px;font-size:10.5px;white-space:nowrap}
  #useHead b{color:var(--ink);font-size:12px}
  .empty2{color:var(--ink3);font-size:12px;padding:14px 13px;text-align:center}

  /* ---------------- 色卡浮层 ---------------- */
  #palPop{position:fixed;z-index:120;width:min(348px,92vw);max-height:70vh;background:#fff;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 44px #0003;
    display:flex;flex-direction:column;overflow:hidden;font-size:12px}
  #palPop[hidden]{display:none}
  .ppTop{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center}
  .ppTop input{padding:5px 7px;border:1px solid var(--line);border-radius:6px;
               font:inherit;font-size:12px;min-width:0;flex:1;width:auto}
  .ppTop input:focus{border-color:var(--accent);outline:none}
  #palClose{flex:0 0 auto;padding:4px 9px}
  #palNear{padding:6px 10px;font-size:11.5px;color:var(--ink2);border-bottom:1px solid var(--line)}
  #palNear[hidden]{display:none}
  #palGrid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,25px);
           gap:4px;padding:10px;align-content:start;min-height:0}
  #palGrid .chip{width:25px;height:25px;border-radius:4px;border:1px solid #0002;padding:0;cursor:pointer}
  #palGrid .chip:hover{outline:2px solid #2f6fed55;outline-offset:1px}
  #palGrid .chip.on{outline:2px solid var(--accent);outline-offset:1px}
  #palGrid .none{grid-column:1/-1;color:var(--ink3);text-align:center;padding:16px 0}

  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#1c1f26;color:#fff;padding:8px 15px;border-radius:8px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:opacity .18s;z-index:99;max-width:70vw;
  }
  #toast.on{opacity:1}


  /* ================= [hackone] v2 左栏重构：三段 + 折叠 + 吸底导出 ================= */
  #side{display:flex;flex-direction:column;padding:0;overflow-x:hidden}
  #side .sec .row{gap:6px}
  #side .sec{padding:11px 14px}
  #side .sec.collapsed .body{display:none}
  #side .h{cursor:pointer;user-select:none;justify-content:space-between;margin-bottom:0;
           padding:2px 0;gap:8px}
  #side .h .t{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink)}
  #side .h .chev{width:12px;text-align:center;color:var(--ink3);font-size:10px;flex:0 0 12px}
  #side .h .chev::before{content:"\25BE"}
  #side .sec.collapsed .h .chev::before{content:"\25B8"}
  #side .h:hover .t{color:var(--accent)}
  #side .sec .body{margin-top:10px}

  #secLoad{padding:10px 14px 12px}
  #drop{padding:12px 10px;border-radius:9px;font-size:12.5px}
  #drop .dim{font-size:11.5px}
  .srcrow{display:flex;align-items:center;gap:8px;margin-top:9px}
  .srcrow #srcInfo{flex:1;min-width:0;font-size:11px;color:var(--ink3);line-height:1.45;margin:0}
  button.sm{padding:4px 9px;font-size:11.5px}
  .chk.inline{margin-top:0;flex:0 0 auto}
  .x{color:var(--ink3);flex:0 0 auto}
  .dim{color:var(--ink3);font-size:11px}
  .seg.mini{flex:0 0 auto}
  .seg.mini button{padding:4px 6px;font-size:11px;min-width:30px}
  .chkrow{display:flex;align-items:center;gap:10px;margin-top:8px}
  #codeSysRow{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
  .chkrow .chk{margin-top:0}
  .chkrow button{margin-left:auto}

  details.adv{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
  details.adv>summary{cursor:pointer;list-style:none;font-size:11.5px;color:var(--ink2);
    display:flex;align-items:center;gap:6px;padding:1px 0}
  details.adv>summary::-webkit-details-marker{display:none}
  details.adv>summary::before{content:"\25B8";color:var(--ink3);font-size:9px}
  details.adv[open]>summary::before{content:"\25BE"}
  details.adv>summary:hover{color:var(--accent)}

  #sizeInfo{margin-top:8px;padding:6px 8px;font-size:11px;background:#f6f8fb;border-radius:6px;
            line-height:1.55;color:var(--ink2)}
  #palInfo{font-size:10.5px;line-height:1.5;color:var(--ink3);margin-top:6px;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  #dock{position:sticky;bottom:0;margin-top:auto;padding:9px 14px 11px;background:#fff;
        border-top:1px solid var(--line);box-shadow:0 -8px 16px #1c1f260d;
        display:flex;flex-direction:column;gap:6px}
  #dock .row{margin-top:0;gap:6px}
  #dock button{flex:1}
  #dock #expA4{width:100%}

  #modebar{gap:8px;flex-wrap:wrap}
  #modebar .sp{flex:1}
  .tools{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;max-width:100%}
  .tools button{padding:5px 8px;font-size:11.5px;border-radius:6px;flex:0 0 auto}
  #toolHint{color:var(--ink3);font-size:11.5px;flex:1 1 auto;min-width:0;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #quickOps{display:flex;gap:4px}
  #quickOps button{padding:5px 8px;font-size:11.5px}
  #viewWrap{position:relative}
  #viewOptsBtn{padding:5px 9px;font-size:11.5px}
  #viewOptsBtn.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
  #viewOpts{position:absolute;top:calc(100% + 6px);right:0;z-index:80;width:238px;background:#fff;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 36px #0002;padding:10px 11px}
  #viewOpts[hidden]{display:none}
  #viewOpts .row{margin-top:8px}

  #paintbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 14px;
    background:#fbfcfe;border-bottom:1px solid var(--line);font-size:12px;flex:0 0 auto}
  .pb-group{display:flex;align-items:center;gap:6px}
  .pb-group[hidden]{display:none}
  .pb-group label{color:var(--ink2);font-size:11.5px}
  #side .row[hidden]{display:none}
  #paintbar #toolHint{flex:1 1 200px}
  #brand{flex:1.15;min-width:0}
  #codeSys{flex:1;min-width:0}
  #paintRow{display:inline-flex;align-items:center;gap:6px;padding:3px 7px;border:1px solid var(--line);
    border-radius:6px;cursor:pointer;background:#fff;margin:0}
  #paintRow:hover{border-color:var(--accent);background:var(--accent2)}

  @media (max-width: 900px){
    #expA4{position:fixed;bottom:14px;right:12px;top:auto;z-index:80;width:auto;min-height:44px;
      padding:0 16px;font-size:12.5px;border-radius:999px;box-shadow:0 8px 22px #2f6fed59}
    #dock{position:static;box-shadow:none;border-top:0;padding-top:0}
    #dock .row{display:none}
    #modebar{gap:6px 8px}
    #tools{order:3;flex:1 1 100%;overflow-x:auto}
    #viewWrap{margin-left:auto}
    #quickOps{order:4}
    #paintbar{padding:6px 10px;gap:10px}
    #paintbar #toolHint{flex:1 1 100%}
  }


  /* ================= [hackone] v3 左栏：分组 + 行 + 开关 ================= */
  #side{padding:0}
  #side .grp{padding:10px 12px 12px;border-bottom:1px solid var(--line)}
  #side .gt{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--ink3);margin-bottom:2px}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:33px;
        padding:3px 0;border-top:1px solid #f2f4f8}
  .row2 .lb{font-size:12px;color:var(--ink2);white-space:nowrap}

<script>
"use strict";
/* =====================================================================
   拼豆图纸工具 —— 单文件离线版
   色板数据在页面顶部的 <script type="application/json" id="paletteData"> 里。
   ===================================================================== */

const $ = id => document.getElementById(id);
const DATA = JSON.parse($('paletteData').textContent);
const BRANDS = DATA.brands;
const ALIASES = DATA.aliases || [];

/* ------------------------------------------------ 色彩数学 -------------- */
const D65 = [0.95047, 1.0, 1.08883];
function srgbToLab(rgb){
  const f = v => { v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  const r = f(rgb[0]), g = f(rgb[1]), b = f(rgb[2]);
  const X = r*0.4124564 + g*0.3575761 + b*0.1804375;
  const Y = r*0.2126729 + g*0.7151522 + b*0.0721750;
  const Z = r*0.0193339 + g*0.1191920 + b*0.9503041;
  const g2 = t => t > 0.008856 ? Math.cbrt(t) : (903.3*t + 16)/116;
  const fx = g2(X/D65[0]), fy = g2(Y/D65[1]), fz = g2(Z/D65[2]);
  return [116*fy - 16, 500*(fx - fy), 200*(fy - fz)];
}
const RAD = Math.PI/180;
function deltaE2000(l1, l2){
  const C1 = Math.hypot(l1[1], l1[2]), C2 = Math.hypot(l2[1], l2[2]);
  const Cbar = (C1 + C2) / 2, P25 = 6103515625;          // 25^7
  const Cb7 = Math.pow(Cbar, 7);
  const G = 0.5 * (1 - Math.sqrt(Cb7 / (Cb7 + P25)));
  const a1p = (1+G)*l1[1], a2p = (1+G)*l2[1];
  const C1p = Math.hypot(a1p, l1[2]), C2p = Math.hypot(a2p, l2[2]);
  const hue = (b, a) => { if (b === 0 && a === 0) return 0; const h = Math.atan2(b, a)/RAD; return h < 0 ? h+360 : h; };
  const h1p = hue(l1[2], a1p), h2p = hue(l2[2], a2p);
  const dLp = l2[0] - l1[0], dCp = C2p - C1p;
  let dhp;
  if (C1p * C2p === 0) dhp = 0;
  else if (Math.abs(h2p - h1p) <= 180) dhp = h2p - h1p;
  else if (h2p - h1p > 180) dhp = h2p - h1p - 360;
  else dhp = h2p - h1p + 360;
  const dHp = 2*Math.sqrt(C1p*C2p)*Math.sin(dhp*RAD/2);
  const Lbp = (l1[0] + l2[0])/2, Cbp = (C1p + C2p)/2;
  let hbp;
  if (C1p*C2p === 0) hbp = h1p + h2p;
  else if (Math.abs(h1p - h2p) <= 180) hbp = (h1p + h2p)/2;
  else if (h1p + h2p < 360) hbp = (h1p + h2p + 360)/2;
  else hbp = (h1p + h2p - 360)/2;
  const T = 1 - 0.17*Math.cos((hbp-30)*RAD) + 0.24*Math.cos(2*hbp*RAD)
              + 0.32*Math.cos((3*hbp+6)*RAD) - 0.20*Math.cos((4*hbp-63)*RAD);
  const dTh = 30*Math.exp(-Math.pow((hbp-275)/25, 2));
  const Cb7b = Math.pow(Cbp, 7);
  const RC = 2*Math.sqrt(Cb7b/(Cb7b + P25));
  const SL = 1 + (0.015*Math.pow(Lbp-50,2))/Math.sqrt(20+Math.pow(Lbp-50,2));
  const SC = 1 + 0.045*Cbp, SH = 1 + 0.015*Cbp*T;
  const RT = -Math.sin(2*dTh*RAD)*RC;
  const t1 = dLp/SL, t2 = dCp/SC, t3 = dHp/SH;
  return Math.sqrt(t1*t1 + t2*t2 + t3*t3 + RT*t2*t3);
}
function de76(a, b){
  const dl = a[0]-b[0], da = a[1]-b[1], db = a[2]-b[2];
  return Math.sqrt(dl*dl + da*da + db*db);
}
function rgbDist(a, b){
  const dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
  return 2*dr*dr + 4*dg*dg + 3*db*db;
}
function textOn(rgb){
  return (0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2]) > 150 ? '#111417' : '#ffffff';
}
function clampN(n){
  n = Math.round(+n);
  if (!isFinite(n)) return 1;
  return Math.max(1, Math.min(400, n));
}
function clampInt(n, lo, hi){
  n = Math.round(+n);
  if (!isFinite(n)) n = lo;
  return Math.max(lo, Math.min(hi, n));
}

/* ------------------------------------------------ 状态 ------------------ */
/* 文档模型：S.base 是「未限色」的匹配结果（-1 = 空格），是图纸的真身；
   S.cells 是限色后的显示/导出结果。所有缩放/换品牌/整理都只动 base，
   不再重新采样原图 —— 这就是「2×/4× 改的是用户看到的画面」的实现方式。 */
const MAXDIM = 400;
const MAX_CANVAS_PX = 24e6;      // 单张画布总像素上限，超了自动降 dpr / 限格子大小
const HIST_BYTES = 64e6;         // 撤销历史内存上限

const S = {
  img:null, srcW:0, srcH:0,
  gw:0, gh:0, base:null, cells:null,
  brandId:'standard', codeSys:'mard',
  algo:'de2000', sample:'nearest', maxColors:0, down:'nearest',
  dither:false, dropBg:false,
  cell:16, showCode:true, showGrid:true, showBoard:true,   // [hackone] 默认显示分板
  flip:false, tool:'inspect', paintIdx:0,
  // [hackone] 进度：模式 + bitmask + 图案 hash；doc 单独存，刷新可恢复
  progress:new Uint8Array(0), progressHash:'',
  brush:1, conn:4, shapeFill:false,
  counts:new Map(), used:null, palette:[], ext:null,
  sel:-1, selCell:-1, hoverCell:-1, highlight:-1, hlCells:null,
  preview:null, drag:null, stroke:null, dragging:false,
  history:[], future:[], histBytes:0,
  buf:null, bufCtx:null, anchor:4, palOpen:false,
  dirtyImg:false
};

/* ------------------------------------------------ 色板 ------------------ */
function paletteOf(brandId){ return BRANDS[brandId]; }

function buildPalette(opts){
  opts = opts || {};
  const oldPal = (S.palette && S.palette.length) ? S.palette : null;
  const b = paletteOf(S.brandId);
  const sys = b.codeSystems.find(c => c.id === S.codeSys) || b.codeSystems[0];
  S.codeSys = sys.id;
  // 换板前记下铅笔色的实际颜色，供越界时就近重找
  const prevPaint = (S.palette && S.palette[S.paintIdx]) ? S.palette[S.paintIdx].rgb : null;
  S.palette = b.colors.map((c, i) => ({
    i, hex:c.hex, rgb:c.rgb, lab:c.lab || srgbToLab(c.rgb),
    code: c.codes[sys.id] || Object.values(c.codes)[0] || '?',
    codes: c.codes,
    name: c.name || ''
  }));
  // 换品牌/体系后色板会变短，旧 paintIdx 可能越界。越界索引一旦写进 cells，
  // draw()/renderUsage() 取 palette[i].hex 就会抛错，整页卡死 —— 所以按颜色就近重找。
  if (!(S.paintIdx >= 0 && S.paintIdx < S.palette.length)){
    S.paintIdx = prevPaint ? nearestIdx(prevPaint, new Map(), 'de2000') : 0;
  }
  const mc = $('maxc');
  mc.max = S.palette.length;
  if (S.maxColors > S.palette.length){ S.maxColors = S.palette.length; mc.value = S.maxColors; }
  paintLabel(S.maxColors);
  const pi = $('palInfo'); if (pi) pi.textContent = `${b.label} · 共 ${S.palette.length} 色`;
  renderAlias();
  updatePaintUI();
  if (opts.remap !== false && S.base && oldPal) remapBase(oldPal);
}
function remapBase(oldPal){
  const map = new Int32Array(oldPal.length);
  const cache = new Map();
  for (let i = 0; i < oldPal.length; i++) map[i] = nearestIdx(oldPal[i].rgb, cache, 'de2000');
  const remapOne = v => {
    if (v < 0) return -1;
    const nv = (v < map.length) ? map[v] : -1;
    return nv;
  };
  for (let i = 0; i < S.base.length; i++) S.base[i] = remapOne(S.base[i]);
  // 撤销记录里存的是旧色板索引，换品牌后必须一起映射，否则撤销会写入越界索引
  for (const h of S.history) remapEntry(h, remapOne);
  for (const h of S.future) remapEntry(h, remapOne);
  applyLimit(false);
}
function remapEntry(h, fn){
  if (h.t === 'c'){
    for (let k = 0; k < h.before.length; k++){ h.before[k] = fn(h.before[k]); h.after[k] = fn(h.after[k]); }
  } else {
    if (h.before && h.before.base) for (let k = 0; k < h.before.base.length; k++) h.before.base[k] = fn(h.before.base[k]);
    if (h.after && h.after.base) for (let k = 0; k < h.after.base.length; k++) h.after.base[k] = fn(h.after.base[k]);
  }
}
function renderAlias(){
  const box = $('palInfo');
  if (!box) return;
  const rel = ALIASES.filter(a => a.system === S.codeSys);
  if (S.brandId === 'standard' && rel.length && rel[0].labels.length){
    box.innerHTML = `<span style="color:#c2410c">同款牌子：${rel[0].labels.join(' / ')}（色号通用）</span>`;
  }
}
function colourSystemOptions(){
  const b = paletteOf(S.brandId);
  const sel = $('codeSys');
  sel.innerHTML = b.codeSystems.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  sel.value = b.codeSystems.some(c => c.id === S.codeSys) ? S.codeSys : b.codeSystems[0].id;
  S.codeSys = sel.value;
  $('codeSysRow').style.display = b.codeSystems.length > 1 ? '' : 'none';
}
function fillBrands(){
  const sel = $('brand');
  sel.innerHTML = Object.entries(BRANDS)
    .map(([id, b]) => `<option value="${id}">${b.short}（${b.count} 色）</option>`).join('');
  sel.value = S.brandId;
}
function updatePaintUI(){
  const sw = $('paintSw'), cd = $('paintCode');
  const p = S.palette && S.palette[S.paintIdx];
  if (!p){ sw.style.background = ''; cd.textContent = '—'; sw.title = ''; return; }
  sw.style.background = p.hex;
  cd.textContent = p.code;
  sw.title = `${p.code} · ${p.hex}`;
}
function setPaint(i, msg){
  if (!(i >= 0 && i < S.palette.length)) return false;
  S.paintIdx = i;
  updatePaintUI();
  if (msg) toast(msg);
  return true;
}

/* ------------------------------------------------ 匹配 ------------------ */
function nearestIdx(rgb, cache, algo){
  const key = (rgb[0] << 16) | (rgb[1] << 8) | rgb[2];
  const hit = cache.get(key);
  if (hit !== undefined) return hit;
  const lab = algo === 'rgb' ? null : srgbToLab(rgb);
  let best = 0, bd = Infinity;
  for (let i = 0; i < S.palette.length; i++){
    const p = S.palette[i];
    let d;
    if (algo === 'de2000') d = deltaE2000(lab, p.lab);
    else if (algo === 'de76') d = de76(lab, p.lab);
    else d = rgbDist(rgb, p.rgb);
    if (d < bd){ bd = d; best = i; }
  }
  cache.set(key, best);
  return best;
}

/* ------------------------------------------------ 画布位图缓冲 ---------- */
function ensureBuffer(){
  if (!S.cells) return;
  if (!S.buf || S.buf.width !== S.gw || S.buf.height !== S.gh){
    S.buf = document.createElement('canvas');
    S.buf.width = S.gw; S.buf.height = S.gh;      // 1 像素 = 1 颗豆
    S.bufCtx = S.buf.getContext('2d');
  }
  rebuildBuffer();
}
function rebuildBuffer(){
  const c = S.bufCtx;
  if (!c || !S.cells) return;
  const img = c.createImageData(S.gw, S.gh);
  const d = img.data;
  for (let i = 0; i < S.cells.length; i++){
    const v = S.cells[i], k = i*4;
    if (v < 0){ d[k] = 244; d[k+1] = 246; d[k+2] = 249; d[k+3] = 255; }
    else {
      const p = S.palette[v];
      d[k] = p.rgb[0]; d[k+1] = p.rgb[1]; d[k+2] = p.rgb[2]; d[k+3] = 255;
    }
  }
  c.putImageData(img, 0, 0);
}
function paintBuffer(i){
  if (!S.bufCtx || !S.cells) return;
  const v = S.cells[i];
  S.bufCtx.fillStyle = v < 0 ? '#f4f6f9' : S.palette[v].hex;
  S.bufCtx.fillRect(i % S.gw, (i / S.gw) | 0, 1, 1);
}

/* ------------------------------------------------ 识别（导入原图） ------ */
function sampleImage(){
  const off = document.createElement('canvas');
  off.width = S.gw; off.height = S.gh;
  const c = off.getContext('2d', { willReadFrequently:true });
  c.imageSmoothingEnabled = S.sample === 'smooth';
  c.imageSmoothingQuality = 'high';
  c.clearRect(0, 0, S.gw, S.gh);
  c.drawImage(S.img, 0, 0, S.gw, S.gh);
  return c.getImageData(0, 0, S.gw, S.gh).data;
}

// 从四边泛洪，只标记"能从边缘连成一片"的同色区域，避免误伤图案内部同色部分
function maskBackground(rgba, W, H, tol){
  const n = W*H, ext = new Uint8Array(n), seed = new Int32Array(n), q = [];
  const push = i => { if (!ext[i] && rgba[i*4+3] >= 128){ ext[i] = 1; seed[i] = i; q.push(i); } };
  for (let x = 0; x < W; x++){ push(x); push((H-1)*W + x); }
  for (let y = 0; y < H; y++){ push(y*W); push(y*W + W - 1); }
  for (let head = 0; head < q.length; head++){
    const i = q[head], si = seed[i];
    const c = [rgba[si*4], rgba[si*4+1], rgba[si*4+2]];
    const x = i % W, y = (i / W) | 0;
    const nb = [[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
    for (const [nx, ny] of nb){
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny*W + nx;
      if (ext[j] || rgba[j*4+3] < 128) continue;
      if (rgbDist([rgba[j*4], rgba[j*4+1], rgba[j*4+2]], c) < tol){
        ext[j] = 1; seed[j] = si; q.push(j);
      }
    }
  }
  return ext;
}

/* 把当前 S.img 识别成 base（未限色的匹配结果）。
   只有导入图片、点「重新识别」时才会调用 —— 尺寸/品牌操作一律不再走这里。 */
function mapCells(){
  if (!S.img) return false;
  const W = S.gw, H = S.gh;
  const rgba = sampleImage();
  const n = W*H;
  S.ext = S.dropBg ? maskBackground(rgba, W, H, 60) : null;
  const cache = new Map();
  const base = new Int32Array(n).fill(-1);

  if (S.dither){
    const buf = new Float32Array(n*3);
    for (let i = 0; i < n; i++){
      buf[i*3] = rgba[i*4]; buf[i*3+1] = rgba[i*4+1]; buf[i*3+2] = rgba[i*4+2];
    }
    const cl = v => v < 0 ? 0 : v > 255 ? 255 : v;
    const add = (x, y, er, eg, eb) => {
      if (x < 0 || y < 0 || x >= W || y >= H) return;
      const k = (y*W + x)*3;
      buf[k] += er; buf[k+1] += eg; buf[k+2] += eb;
    };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const i = y*W + x;
      if (rgba[i*4+3] < 128 || (S.ext && S.ext[i])){ base[i] = -1; continue; }
      const rgb = [cl(buf[i*3]) | 0, cl(buf[i*3+1]) | 0, cl(buf[i*3+2]) | 0];
      const idx = nearestIdx(rgb, cache, S.algo);
      base[i] = idx;
      const p = S.palette[idx].rgb;
      const er = rgb[0]-p[0], eg = rgb[1]-p[1], eb = rgb[2]-p[2];
      add(x+1, y,   er*7/16, eg*7/16, eb*7/16);
      add(x-1, y+1, er*3/16, eg*3/16, eb*3/16);
      add(x,   y+1, er*5/16, eg*5/16, eb*5/16);
      add(x+1, y+1, er/16,   eg/16,   eb/16);
    }
  } else {
    for (let i = 0; i < n; i++){
      if (rgba[i*4+3] < 128 || (S.ext && S.ext[i])){ base[i] = -1; continue; }
      base[i] = nearestIdx([rgba[i*4], rgba[i*4+1], rgba[i*4+2]], cache, S.algo);
    }
  }

  // 镜像放在配色之后：让「翻转」等于把看到的结果照镜子，而不是重新配一遍色
  if (S.flip) mirrorArray(base, W, H);

  S.base = base;
  S.cells = limitColors(base, S.maxColors);
  S.buf = null; S.bufCtx = null;
  S.stroke = null; S.preview = null; S.drag = null; S.dragging = false;
  S.selCell = -1; S.highlight = -1; S.hlCells = null;
  ensureBuffer();
  recount(); renderUsage(); renderSimilar(); requestDraw();
  return true;
}

/* ---- 限色：把用得最少的颜色并入最接近的保留色 ---- */
function limitColors(src, max){
  const out = Int32Array.from(src);
  const cnt = new Map();
  for (let i = 0; i < out.length; i++){
    const v = out[i];
    if (v >= 0) cnt.set(v, (cnt.get(v) || 0) + 1);
  }
  if (!max || max <= 0 || cnt.size <= max) return out;

  const alive = new Map(cnt);
  const drop = new Map();
  const nearestAlive = id => {
    let best = -1, bd = Infinity;
    for (const j of alive.keys()){
      if (j === id) continue;
      const d = deltaE2000(S.palette[id].lab, S.palette[j].lab);
      if (d < bd){ bd = d; best = j; }
    }
    return best;
  };
  let guard = 0;
  while (alive.size > max && guard++ < 5000){
    let victim = -1, vc = Infinity;
    for (const [id, c] of alive) if (c < vc){ vc = c; victim = id; }
    const keep = nearestAlive(victim);
    if (keep < 0) break;
    alive.set(keep, alive.get(keep) + vc);
    alive.delete(victim);
    drop.set(victim, keep);           // 只记一步，最后统一解析链
  }
  const resolve = id => {
    let d = 0;
    while (drop.has(id) && d++ < 1000) id = drop.get(id);
    return id;
  };
  for (let i = 0; i < out.length; i++){
    const v = out[i];
    if (v < 0) continue;
    const r = resolve(v);
    if (r !== v) out[i] = r;
  }
  return out;
}

function applyLimit(redraw){
  if (!S.base) return;
  S.cells = limitColors(S.base, S.maxColors);
  ensureBuffer();
  recount(); renderUsage();
  if (redraw !== false) requestDraw();
}

/* ---- 左右翻转 ---- */
function mirrorArray(a, W, H){
  for (let y = 0; y < H; y++){
    const row = y*W;
    for (let x = 0, xe = W >> 1; x < xe; x++){
      const i = row + x, j = row + W - 1 - x;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
  }
}
function mirrorCells(a){ mirrorArray(a, S.gw, S.gh); }
function mirrorIndex(i){
  const x = i % S.gw, y = (i / S.gw) | 0;
  return y*S.gw + (S.gw - 1 - x);
}
function flipGrid(){
  if (!S.base){ toast('先导入图片或新建图纸'); return; }
  mirrorArray(S.base, S.gw, S.gh);
  mirrorArray(S.cells, S.gw, S.gh);
  // 撤销记录存的是格子下标，镜像后同一下标指向另一格 —— 坐标必须一起镜像
  for (const h of S.history) if (h.t === 'c') mirrorPositions(h);
  for (const h of S.future) if (h.t === 'c') mirrorPositions(h);
  if (S.progress && S.progress.length === Math.ceil(S.cells.length / 8)){
    const bits = new Uint8Array(S.cells.length);
    for (let i = 0; i < bits.length; i++) bits[i] = (S.progress[i >> 3] >> (i & 7)) & 1;
    mirrorArray(bits, S.gw, S.gh);
    S.progress.fill(0);
    for (let i = 0; i < bits.length; i++) if (bits[i]) S.progress[i >> 3] |= (1 << (i & 7));
    S.progressHash = progressPatternHash();
    S.statsDirty = true;
  }
  if (S.selCell >= 0) S.selCell = mirrorIndex(S.selCell);
  if (S.highlight >= 0) S.hlCells = cellsWith(S.highlight);
  S.preview = null;
  S.flip = !S.flip;
  updateFlipBtn();
  rebuildBuffer();
  recount(); renderUsage(); requestDraw();
  if (S.selCell >= 0) inspect(S.selCell);
  toast(S.flip ? '已左右翻转（再点一次翻回来）' : '已翻回原方向');
}
function mirrorPositions(h){
  for (let k = 0; k < h.pos.length; k++) h.pos[k] = mirrorIndex(h.pos[k]);
}
function updateFlipBtn(){
  const b = $('flip');
  if (!b) return;
  b.classList.toggle('on', S.flip);
  b.setAttribute('data-tip', S.flip ? '已翻转（再点还原）' : '左右翻转');
  b.setAttribute('aria-label', S.flip ? '已翻转（再点还原）' : '左右翻转');
}

/* ------------------------------------------------ [hackone] 拼装进度 -------------- */
const PROGRESS_KEY = 'hackone:progress:v1';
const DOC_KEY = 'hackone:doc:v1';

function progressPatternHash(){
  if (!S.cells) return '';
  let h = 2166136261;
  h = Math.imul(h ^ S.gw, 16777619);
  h = Math.imul(h ^ S.gh, 16777619);
  for (let i = 0; i < S.cells.length; i++) h = Math.imul(h ^ (S.cells[i] + 1), 16777619);
  return (h >>> 0).toString(16);
}
function progressByteCount(){
  return S.cells ? Math.ceil(S.cells.length / 8) : 0;
}
// 只有"换了一张图/新建一张画布"才主动清进度；撤销、整理、翻转都不清
function resetProgress(){
  S.progress = new Uint8Array(progressByteCount());
  S.progressHash = '';
  S.statsDirty = true;
}
function syncProgress(){
  if (!S.cells){
    S.progress = new Uint8Array(0);
    S.progressHash = '';
    return;
  }
  const h = progressPatternHash();
  S.progressHash = h;
  const n = progressByteCount();
  // [hackone] 只有画布尺寸变了才清进度；整理、重新识别、撤销都不会把已拼记录清零
  if (S.progress.length === n) return;
  S.progress = new Uint8Array(n);
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.patternHash === h && Array.isArray(d.bitmask) && d.bitmask.length === n){
      S.progress = Uint8Array.from(d.bitmask);
    }
  } catch (e) { /* 隐私模式/损坏数据 */ }
}
function saveProgress(){
  if (!S.cells) return;
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({
      patternHash: S.progressHash,
      bitmask: Array.from(S.progress)
    }));
  } catch (e) { /* 配额满时只保留当前会话 */ }
}
function hasProgress(i){
  return !!(S.progress && S.progress[i >> 3] & (1 << (i & 7)));
}
function pctText(done, total){
  if (!total) return '0%';
  const p = done / total * 100;
  if (p <= 0) return '0%';
  if (p < 0.1) return '<0.1%';
  return (p < 1 ? p.toFixed(1) : Math.round(p)) + '%';
}
function renderProgress(){
  syncProgress();
  const totalBeads = S.used ? S.used.reduce((a, u) => a + u.c, 0) : 0;
  if (!S.cells || !totalBeads){
    $('progTotal').textContent = '—';
    $('progFill').style.width = '0%';
    return;
  }
  let done = 0;
  for (let i = 0; i < S.cells.length; i++){
    if (S.cells[i] >= 0 && hasProgress(i)) done++;
  }
  $('progTotal').textContent = done + ' / ' + totalBeads + ' 颗 · ' + pctText(done, totalBeads);
  $('progFill').style.width = (totalBeads ? done / totalBeads * 100 : 0) + '%';

}
function toggleProgress(i){
  if (!S.cells) return;
  if (i < 0 || i >= S.cells.length) return;
  if (S.cells[i] < 0){ toast('空格子不用标进度'); return; }
  syncProgress();
  const byte = i >> 3, bit = 1 << (i & 7);
  S.progress[byte] ^= bit;
  saveProgress();
  renderProgress();
  requestDraw();
}
function saveDoc(){
  if (!S.cells || !S.base) return;
  try {
    localStorage.setItem(DOC_KEY, JSON.stringify({
      gw:S.gw, gh:S.gh, base:Array.from(S.base), cells:Array.from(S.cells),
      brandId:S.brandId, codeSys:S.codeSys, maxColors:S.maxColors
    }));
  } catch (e) { /* 配额满时忽略 */ }
}
function restoreDoc(){
  try {
    const raw = localStorage.getItem(DOC_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.base) || !Array.isArray(d.cells)) return false;
    if (d.gw * d.gh !== d.cells.length || d.base.length !== d.cells.length) return false;
    if (d.brandId && d.brandId !== S.brandId){
      S.brandId = d.brandId;
      if ($('brand')) $('brand').value = d.brandId;
      colourSystemOptions();
    }
    if (d.codeSys) S.codeSys = d.codeSys;
    buildPalette({ remap:false });
    S.gw = d.gw; S.gh = d.gh;
    S.base = d.base; S.cells = d.cells;
    S.maxColors = d.maxColors || 0;
    if ($('maxc')) $('maxc').value = S.maxColors;
    S.buf = null; S.bufCtx = null;
    syncDocInputs();
    ensureBuffer();
    recount(); renderUsage(); renderSimilar(); requestDraw();
    fit();
    if ($('srcInfo')) $('srcInfo').textContent = '已恢复上次图纸；重新导入图片可覆盖';
    return true;
  } catch (e) {
    return false;
  }
}

/* ------------------------------------------------ 统计 ------------------ */
function recount(){
  const cnt = new Map();
  let total = 0;
  if (S.cells){
    for (let i = 0; i < S.cells.length; i++){
      const v = S.cells[i];
      if (v < 0) continue;
      cnt.set(v, (cnt.get(v) || 0) + 1);
      total++;
    }
  }
  S.counts = cnt;
  S.used = [...cnt.entries()].sort((a, b) => b[1] - a[1]).map(([i, c]) => ({ i, c }));
  if (!S.cells){
    $('barInfo').textContent = '导入图片或新建空白图纸后开始';
    $('useTotal').textContent = '—';
    // [hackone] 无图时进度归零
    renderProgress();
    return;
  }
  const cols = Math.ceil(S.gw/29), rows = Math.ceil(S.gh/29);
  $('barInfo').innerHTML = `网格 <b>${S.gw}×${S.gh}</b> · <b>${S.used.length}</b> 色 · 共 <b>${total}</b> 颗`
    + ` · 约 <b>${cols*rows}</b> 块 29×29 底板`
    + (S.flip ? ' · <b style="color:#2f6fed">⇄ 已左右翻转</b>' : '');
  $('useTotal').textContent = total ? total + ' 颗' : '—';
  // [hackone] 图案变了就同步 hash/bitmask；文档自动保存，刷新可恢复
  saveDoc();
  renderProgress();
}
function cellsWith(v){
  const out = [];
  if (!S.cells) return out;
  for (let i = 0; i < S.cells.length; i++) if (S.cells[i] === v) out.push(i);
  return out;
}
function setHighlight(i){
  S.highlight = (S.highlight === i) ? -1 : i;
  S.hlCells = S.highlight >= 0 ? cellsWith(S.highlight) : null;
  renderUsage(); renderSimilar(); requestDraw();
}

/* ------------------------------------------------ 绘制 ------------------ */
// [hackone] 分板：29×29，先行后列编号；屏幕与 A4 导出共用
const BOARD_SIZE = 29;
function boardCols(){ return Math.max(1, Math.ceil(S.gw / BOARD_SIZE)); }
function boardRows(){ return Math.max(1, Math.ceil(S.gh / BOARD_SIZE)); }
function boardNo(bx, by){ return by * boardCols() + bx + 1; }

const canvas = $('grid');
const ctx = canvas.getContext('2d');
let rafId = 0;

function requestDraw(){
  if (rafId) return;
  rafId = 1;
  const raf = (typeof window !== 'undefined' && window.requestAnimationFrame)
    ? window.requestAnimationFrame.bind(window) : (fn => setTimeout(fn, 0));
  raf(() => { rafId = 0; draw(); });
}
function effDpr(W, H){
  const base = Math.min(2, window.devicePixelRatio || 1);
  if (!W || !H) return base;
  if (W*H*base*base <= MAX_CANVAS_PX) return base;
  return Math.max(1, Math.min(base, Math.sqrt(MAX_CANVAS_PX/(W*H))));
}
function cellCap(){
  if (!S.gw || !S.gh) return 60;
  return Math.max(2, Math.min(60, Math.floor(Math.sqrt(MAX_CANVAS_PX/(S.gw*S.gh)))));
}
function visibleRange(){
  const full = { x0:0, y0:0, x1:S.gw, y1:S.gh };
  const v = $('view');
  if (!v || !v.getBoundingClientRect || !canvas.getBoundingClientRect || !S.cell) return full;
  const vr = v.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
  if (!cr.width || !cr.height) return full;
  const px0 = Math.max(0, vr.left - cr.left);
  const py0 = Math.max(0, vr.top - cr.top);
  const px1 = Math.min(cr.width, vr.right - cr.left);
  const py1 = Math.min(cr.height, vr.bottom - cr.top);
  if (px1 <= px0 || py1 <= py0) return full;
  const x0 = Math.max(0, Math.floor(px0/S.cell) - 1);
  const y0 = Math.max(0, Math.floor(py0/S.cell) - 1);
  const x1 = Math.min(S.gw, Math.ceil(px1/S.cell) + 1);
  const y1 = Math.min(S.gh, Math.ceil(py1/S.cell) + 1);
  return (x1 > x0 && y1 > y0) ? { x0, y0, x1, y1 } : full;
}
function draw(){
  if (!S.cells){ canvas.hidden = true; $('empty').style.display = ''; if ($('importPill')) $('importPill').hidden = true; return; }
  canvas.hidden = false;
  $('empty').style.display = 'none';
  if ($('importPill')) $('importPill').hidden = false;

  const cs = S.cell, W = S.gw*cs, H = S.gh*cs;
  const dpr = effDpr(W, H);
  const pw = Math.round(W*dpr), ph = Math.round(H*dpr);
  if (canvas.width !== pw || canvas.height !== ph){   // 只在尺寸变了时重建画布缓冲
    canvas.width = pw;
    canvas.height = ph;
  }
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  if (!S.buf) ensureBuffer();
  ctx.imageSmoothingEnabled = false;
  if (S.buf) ctx.drawImage(S.buf, 0, 0, S.gw, S.gh, 0, 0, W, H);

  const R = visibleRange();
  // [hackone] 已完成格：半透明绿，画在色号下面保证可读
  if (S.progress && S.progress.length === Math.ceil(S.cells.length / 8)){
    ctx.fillStyle = 'rgba(22,163,74,.32)';
    for (let y = R.y0; y < R.y1; y++) for (let x = R.x0; x < R.x1; x++){
      const i = y*S.gw + x;
      if (S.cells[i] >= 0 && (S.progress[i >> 3] & (1 << (i & 7)))){
        ctx.fillRect(x*cs, y*cs, cs, cs);
      }
    }
  }
  const showCodes = S.showCode && cs >= 9;
  if (showCodes){
    ctx.font = `600 ${Math.max(6, Math.min(11, Math.round(cs*0.38)))}px "SF Mono",Consolas,monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let y = R.y0; y < R.y1; y++) for (let x = R.x0; x < R.x1; x++){
      const v = S.cells[y*S.gw + x];
      if (v < 0) continue;
      const p = S.palette[v];
      ctx.fillStyle = textOn(p.rgb);
      ctx.fillText(p.code, x*cs + cs/2, y*cs + cs/2 + 0.5);
    }
  }

  if (S.showGrid && cs >= 4){
    ctx.strokeStyle = 'rgba(0,0,0,.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = R.x0; x <= R.x1; x++){
      const px = Math.round(x*cs) + .5;
      ctx.moveTo(px, R.y0*cs); ctx.lineTo(px, R.y1*cs);
    }
    for (let y = R.y0; y <= R.y1; y++){
      const py = Math.round(y*cs) + .5;
      ctx.moveTo(R.x0*cs, py); ctx.lineTo(R.x1*cs, py);
    }
    ctx.stroke();
  }
  if (S.highlight >= 0 && cs >= 3 && S.hlCells){
    ctx.strokeStyle = 'rgba(47,111,237,.95)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const i of S.hlCells){
      const x = i % S.gw, y = (i / S.gw) | 0;
      if (x < R.x0 || x >= R.x1 || y < R.y0 || y >= R.y1) continue;
      ctx.rect(x*cs + 1, y*cs + 1, cs - 2, cs - 2);
    }
    ctx.stroke();
  }
  if (S.preview && S.preview.cells && S.preview.v >= 0){
    const p = S.palette[S.preview.v];
    ctx.globalAlpha = .62;
    ctx.fillStyle = p.hex;
    for (const i of S.preview.cells){
      const x = i % S.gw, y = (i / S.gw) | 0;
      if (x < R.x0 || x >= R.x1 || y < R.y0 || y >= R.y1) continue;
      ctx.fillRect(x*cs, y*cs, cs, cs);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(17,17,23,.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const i of S.preview.cells){
      const x = i % S.gw, y = (i / S.gw) | 0;
      if (x < R.x0 || x >= R.x1 || y < R.y0 || y >= R.y1) continue;
      ctx.rect(x*cs + .5, y*cs + .5, cs - 1, cs - 1);
    }
    ctx.stroke();
  }
  if (S.selCell >= 0 && S.selCell < S.cells.length){
    const x = S.selCell % S.gw, y = (S.selCell / S.gw) | 0;
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
    ctx.strokeRect(x*cs + 1, y*cs + 1, cs - 2, cs - 2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.strokeRect(x*cs + 2.5, y*cs + 2.5, cs - 5, cs - 5);
  }
  // 笔刷范围预览
  if (S.hoverCell >= 0 && (S.tool === 'pencil' || S.tool === 'eraser') && S.brush > 1){
    const cx = S.hoverCell % S.gw, cy = (S.hoverCell / S.gw) | 0;
    const r = (S.brush - 1) / 2;
    const x0 = Math.round(cx - r), y0 = Math.round(cy - r);
    ctx.strokeStyle = 'rgba(47,111,237,.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x0*cs + 1, y0*cs + 1, S.brush*cs - 2, S.brush*cs - 2);
  }
}

/* ------------------------------------------------ 文档操作 -------------- */
function installDoc(nw, nh, base){
  S.gw = nw; S.gh = nh; S.base = base;
  S.cells = limitColors(base, S.maxColors);
  S.selCell = -1; S.highlight = -1; S.hlCells = null;
  S.preview = null; S.drag = null; S.stroke = null; S.dragging = false;
  S.buf = null; S.bufCtx = null;
  ensureBuffer();
  syncDocInputs();
  recount(); renderUsage(); renderSimilar(); requestDraw();
}
function syncDocInputs(setSquare){
  if (!S.cells) return;
  $('sideLen').value = Math.max(S.gw, S.gh);
  $('gw').value = S.gw;
  $('gh').value = S.gh;
  $('cw').value = S.gw;
  $('ch').value = S.gh;
  if (setSquare !== false) $('square').checked = (S.gw === S.gh);
  updateSizeInfo();
}

/* ---- 重采样：只吃「当前画面」的 base，不再碰原图 ---- */
function resampleBase(nw, nh, mode){
  const ow = S.gw, oh = S.gh, src = S.base;
  const out = new Int32Array(nw*nh).fill(-1);
  const exactUp = (nw % ow === 0) && (nh % oh === 0) && nw >= ow && nh >= oh;
  if (exactUp){
    const fx = nw / ow, fy = nh / oh;
    for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++){
      const v = src[y*ow + x];
      if (v < 0) continue;
      for (let dy = 0; dy < fy; dy++){
        const row = (y*fy + dy)*nw + x*fx;
        for (let dx = 0; dx < fx; dx++) out[row + dx] = v;
      }
    }
    return out;
  }
  const shrinking = nw <= ow && nh <= oh && (nw < ow || nh < oh);
  if (shrinking && mode === 'area'){
    for (let y = 0; y < nh; y++){
      const sy0 = y*oh/nh, sy1 = (y+1)*oh/nh;
      for (let x = 0; x < nw; x++){
        const sx0 = x*ow/nw, sx1 = (x+1)*ow/nw;
        let r = 0, g = 0, b = 0, wsum = 0, tot = 0;
        for (let sy = Math.floor(sy0); sy < Math.ceil(sy1); sy++){
          if (sy < 0 || sy >= oh) continue;
          const wy = Math.min(sy+1, sy1) - Math.max(sy, sy0);
          if (wy <= 0) continue;
          for (let sx = Math.floor(sx0); sx < Math.ceil(sx1); sx++){
            if (sx < 0 || sx >= ow) continue;
            const wx = Math.min(sx+1, sx1) - Math.max(sx, sx0);
            if (wx <= 0) continue;
            const w = wx*wy;
            tot += w;
            const v = src[sy*ow + sx];
            if (v < 0) continue;
            const p = S.palette[v];
            r += p.rgb[0]*w; g += p.rgb[1]*w; b += p.rgb[2]*w; wsum += w;
          }
        }
        if (!tot || !wsum || wsum/tot < 0.34) continue;
        out[y*nw + x] = nearestIdx(
          [Math.round(r/wsum), Math.round(g/wsum), Math.round(b/wsum)], new Map(), S.algo);
      }
    }
    return out;
  }
  // 最近邻（放大一律走这里）
  for (let y = 0; y < nh; y++){
    const sy = Math.min(oh-1, Math.floor((y + 0.5)*oh/nh));
    for (let x = 0; x < nw; x++){
      const sx = Math.min(ow-1, Math.floor((x + 0.5)*ow/nw));
      out[y*nw + x] = src[sy*ow + sx];
    }
  }
  return out;
}

function resizeTo(nw, nh, opts){
  opts = opts || {};
  if (!S.cells) return false;
  nw = clampN(nw); nh = clampN(nh);
  if (nw === S.gw && nh === S.gh){ syncDocInputs(); return false; }
  const out = resampleBase(nw, nh, S.down);
  pushSnap();
  S.base = out;
  S.gw = nw; S.gh = nh;
  S.cells = limitColors(out, S.maxColors);
  S.selCell = -1; S.highlight = -1; S.hlCells = null;
  S.preview = null; S.drag = null; S.stroke = null;
  S.buf = null; S.bufCtx = null;
  ensureBuffer();
  syncDocInputs(); recount(); renderUsage(); renderSimilar(); requestDraw();
  if (opts.fit !== false) fit();
  return true;
}

function expandCanvas(nw, nh, a){
  if (!S.cells){ toast('先导入图片或新建图纸'); return false; }
  nw = clampN(nw); nh = clampN(nh);
  if (nw === S.gw && nh === S.gh) return false;
  const col = a % 3, row = (a / 3) | 0;
  const ox = col === 0 ? 0 : col === 1 ? Math.floor((nw - S.gw)/2) : nw - S.gw;
  const oy = row === 0 ? 0 : row === 1 ? Math.floor((nh - S.gh)/2) : nh - S.gh;
  const out = new Int32Array(nw*nh).fill(-1);
  let cropped = 0;
  for (let y = 0; y < S.gh; y++){
    const ty = y + oy;
    for (let x = 0; x < S.gw; x++){
      const tx = x + ox;
      const v = S.base[y*S.gw + x];
      if (tx < 0 || ty < 0 || tx >= nw || ty >= nh){ if (v >= 0) cropped++; continue; }
      out[ty*nw + tx] = v;
    }
  }
  pushSnap();
  S.base = out;
  S.gw = nw; S.gh = nh;
  S.cells = limitColors(out, S.maxColors);
  S.selCell = -1; S.highlight = -1; S.hlCells = null;
  S.preview = null; S.drag = null;
  S.buf = null; S.bufCtx = null;
  ensureBuffer();
  syncDocInputs(); recount(); renderUsage(); renderSimilar(); requestDraw();
  fit();
  toast(cropped ? `画布已调整，裁掉 ${cropped} 颗有颜色的格子（可撤销）` : '画布已调整');
  return true;
}

function newBlank(w, h){
  w = clampN(w); h = clampN(h);
  pushSnap();
  S.img = null; S.srcW = 0; S.srcH = 0;
  S.flip = false; updateFlipBtn();
  $('srcInfo').textContent = `空白图纸 ${w}×${h}（没有导入图片）`;
  installDoc(w, h, new Int32Array(w*h).fill(-1));
  resetProgress();
  fit();
  toast(`已新建 ${w}×${h} 空白图纸`);
}

function setSide(n){
  n = clampN(n);
  if (!S.cells) return;
  if ($('square').checked || !S.gw || !S.gh){ resizeTo(n, n); return; }
  const ar = S.gh / S.gw;
  if (S.gw >= S.gh) resizeTo(n, clampN(n*ar));
  else resizeTo(clampN(n/ar), n);
}

function fit(){
  if (!S.cells) return;
  const v = $('view');
  const availW = (v.clientWidth || 900) - 40, availH = (v.clientHeight || 700) - 40;
  const raw = Math.min(availW/S.gw, availH/S.gh);
  setCellSize(Math.max(2, Math.min(cellCap(), Math.floor(raw) || 2)));
}
function setCellSize(cs){
  S.cell = Math.max(2, Math.min(60, Math.min(cellCap(), Math.round(+cs) || 2)));
  $('cell').value = S.cell;
  $('cellV').textContent = S.cell;
  requestDraw();
}

/* ------------------------------------------------ 撤销 / 重做 ----------- */
function entryBytes(e){
  if (e.t === 'd'){
    var n = e.before.base.byteLength + (e.after ? e.after.base.byteLength : 0);
    if (e.before.prog) n += e.before.prog.byteLength;
    if (e.after && e.after.prog) n += e.after.prog.byteLength;
    return n;
  }
  return e.pos.byteLength + e.before.byteLength + e.after.byteLength;
}
function pushHist(e){
  S.future.length = 0;
  S.history.push(e);
  S.histBytes += entryBytes(e);
  while (S.histBytes > HIST_BYTES && S.history.length > 1){
    S.histBytes -= entryBytes(S.history.shift());
  }
}
function snapDoc(){
  // 进度一起拍快照：撤销「新建空白」「整理」「改尺寸」时已拼记录不该丢
  return { gw:S.gw, gh:S.gh, base:Int32Array.from(S.base),
           prog: (S.progress && S.progress.length) ? Uint8Array.from(S.progress) : null };
}
function pushSnap(){
  if (!S.base) return;
  pushHist({ t:'d', before:snapDoc(), after:null });
}
function undo(){
  if (!S.history.length){ toast('没有可撤销的操作'); return false; }
  const e = S.history.pop();
  S.histBytes -= entryBytes(e);
  if (e.t === 'd' && !e.after){
    e.after = snapDoc();              // 先记下"撤销前"的样子，重做才能回去
    S.histBytes += entryBytes(e);
  }
  applyEntry(e, 'undo');
  S.future.push(e);
  toast('已撤销');
  return true;
}
function redo(){
  if (!S.future.length){ toast('没有可重做的操作'); return false; }
  const e = S.future.pop();
  applyEntry(e, 'redo');
  S.history.push(e);
  S.histBytes += entryBytes(e);
  toast('已重做');
  return true;
}
function applyEntry(e, dir){
  S.preview = null; S.drag = null; S.stroke = null; S.dragging = false;
  if (e.t === 'd'){
    const s = (dir === 'undo') ? e.before : (e.after || e.before);
    installDoc(s.gw, s.gh, Int32Array.from(s.base));
    if (s.prog && s.prog.length === progressByteCount()){
      S.progress = Uint8Array.from(s.prog);
      S.progressHash = progressPatternHash();
      renderProgress();
      requestDraw();
    } else {
      resetProgress();
    }
    return;
  }
  const arr = dir === 'undo' ? e.before : e.after;
  for (let k = 0; k < e.pos.length; k++){
    const i = e.pos[k];
    S.cells[i] = arr[k];
    S.base[i] = arr[k];
    paintBuffer(i);
  }
  recount(); renderUsage(); renderSimilar(); requestDraw();
  if (S.selCell >= 0) inspect(S.selCell);
}

/* ------------------------------------------------ 绘画原语 -------------- */
function beginStroke(){ S.stroke = { map:new Map() }; }
function recordCell(i){
  if (!S.stroke) S.stroke = { map:new Map() };
  if (!S.stroke.map.has(i)) S.stroke.map.set(i, S.cells[i]);
}
function paintCell(i, v){
  if (!S.cells || S.cells[i] === v) return false;
  recordCell(i);
  S.cells[i] = v;
  S.base[i] = v;
  paintBuffer(i);
  return true;
}
function endStroke(){
  const st = S.stroke;
  S.stroke = null;
  if (!st || !st.map.size) return 0;
  const pos = Int32Array.from(st.map.keys());
  const before = Int32Array.from(st.map.values());
  const after = new Int32Array(pos.length);
  let changed = 0;
  for (let k = 0; k < pos.length; k++){
    after[k] = S.cells[pos[k]];
    if (after[k] !== before[k]) changed++;
  }
  if (!changed) return 0;
  pushHist({ t:'c', pos, before, after });
  return changed;
}
function cancelStroke(){
  var st = S.stroke;
  S.stroke = null;
  if (st && st.map && st.map.size){
    st.map.forEach(function(v, i){ S.cells[i] = v; S.base[i] = v; paintBuffer(i); });
  }
  S.dragging = false; S.drag = null; S.preview = null;
  requestDraw();
}
function afterPaint(){
  recount();
  if (!S.dragging) renderUsage();
  if (S.highlight >= 0) S.hlCells = cellsWith(S.highlight);
  renderSimilar();
  requestDraw();
}
function validPaint(){
  if (S.paintIdx >= 0 && S.paintIdx < S.palette.length) return true;
  toast('请先选一个铅笔色（点「铅笔色」打开色卡）');
  return false;
}
function paintBrush(cellIdx, v){
  if (!S.cells) return 0;
  const n = S.brush, r = (n - 1) / 2;
  const cx = cellIdx % S.gw, cy = (cellIdx / S.gw) | 0;
  const x0 = Math.round(cx - r), y0 = Math.round(cy - r);
  let hit = 0;
  for (let y = y0; y < y0 + n; y++){
    if (y < 0 || y >= S.gh) continue;
    for (let x = x0; x < x0 + n; x++){
      if (x < 0 || x >= S.gw) continue;
      if (paintCell(y*S.gw + x, v)) hit++;
    }
  }
  if (hit) afterPaint();
  return hit;
}
function floodFill(start, conn, v){
  if (!S.cells) return 0;
  const target = S.cells[start];
  if (target === v) return 0;
  const W = S.gw, H = S.gh;
  const seen = new Uint8Array(W*H);
  const stack = [start];
  seen[start] = 1;
  let filled = 0;
  const D4 = [[1,0],[-1,0],[0,1],[0,-1]];
  const D8 = [[1,1],[1,-1],[-1,1],[-1,-1]];
  const visit = (x, y) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const j = y*W + x;
    if (seen[j] || S.cells[j] !== target) return;
    seen[j] = 1;
    stack.push(j);
  };
  while (stack.length){
    const i = stack.pop();
    if (S.cells[i] !== target) continue;
    paintCell(i, v);
    filled++;
    const x = i % W, y = (i / W) | 0;
    for (let d = 0; d < 4; d++) visit(x + D4[d][0], y + D4[d][1]);
    if (conn === 8) for (let d = 0; d < 4; d++) visit(x + D8[d][0], y + D8[d][1]);
  }
  return filled;
}

/* ---- 形状 ---- */
function lineCells(a, b){
  const W = S.gw, out = [];
  let x0 = a % W, y0 = (a / W) | 0;
  const x1 = b % W, y1 = (b / W) | 0;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;){
    out.push(y0*W + x0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2*err;
    if (e2 >= dy){ err += dy; x0 += sx; }
    if (e2 <= dx){ err += dx; y0 += sy; }
  }
  return out;
}
function rectCells(a, b, fill){
  const W = S.gw, out = [];
  const x0 = a % W, y0 = (a / W) | 0, x1 = b % W, y1 = (b / W) | 0;
  const xa = Math.min(x0, x1), xb = Math.max(x0, x1);
  const ya = Math.min(y0, y1), yb = Math.max(y0, y1);
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++){
    if (fill || x === xa || x === xb || y === ya || y === yb) out.push(y*W + x);
  }
  return out;
}
function ellipseCells(a, b, fill){
  const W = S.gw, out = [];
  const x0 = a % W, y0 = (a / W) | 0, x1 = b % W, y1 = (b / W) | 0;
  const xa = Math.min(x0, x1), xb = Math.max(x0, x1);
  const ya = Math.min(y0, y1), yb = Math.max(y0, y1);
  const cx = (xa + xb) / 2, cy = (ya + yb) / 2;
  const rx = Math.max(.5, (xb - xa) / 2), ry = Math.max(.5, (yb - ya) / 2);
  const inside = (x, y) => {
    const dx = (x - cx) / rx, dy = (y - cy) / ry;
    return dx*dx + dy*dy <= 1.0001;
  };
  if (rx <= .5 && ry <= .5){ out.push(ya*W + xa); return out; }
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++){
    if (!inside(x, y)) continue;
    if (fill || !inside(x-1, y) || !inside(x+1, y) || !inside(x, y-1) || !inside(x, y+1))
      out.push(y*W + x);
  }
  return out;
}
function shapeIndices(tool, a, b){
  if (tool === 'line') return lineCells(a, b);
  if (tool === 'rect') return rectCells(a, b, S.shapeFill);
  if (tool === 'ellipse') return ellipseCells(a, b, S.shapeFill);
  return [];
}
function updatePreview(b){
  if (!S.drag) return;
  S.drag.last = b;
  S.preview = { v:S.paintIdx, cells:shapeIndices(S.drag.tool, S.drag.start, b) };
  requestDraw();
}
function commitShape(endIdx){
  const d = S.drag;
  if (!d) return;
  S.drag = null;
  S.preview = null;
  const list = shapeIndices(d.tool, d.start, endIdx);
  if (!list.length || !validPaint()){ requestDraw(); return; }
  beginStroke();
  for (const i of list) paintCell(i, S.paintIdx);
  endStroke();
  afterPaint();
}

}

/* ------------------------------------------------ 配色整理 -------------- */
function despeckle(out, maxSize){
  const W = S.gw, H = S.gh, n = W*H;
  const seen = new Uint8Array(n);
  const stack = [];
  const D4 = [[1,0],[-1,0],[0,1],[0,-1]];
  let moved = 0;
  for (let i = 0; i < n; i++){
    if (seen[i] || out[i] < 0) continue;
    const v = out[i];
    const comp = [];
    stack.push(i); seen[i] = 1;
    while (stack.length){
      const k = stack.pop();
      comp.push(k);
      const x = k % W, y = (k / W) | 0;
      for (let d = 0; d < 4; d++){
        const nx = x + D4[d][0], ny = y + D4[d][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny*W + nx;
        if (!seen[j] && out[j] === v){ seen[j] = 1; stack.push(j); }
      }
    }
    if (comp.length > maxSize) continue;
    const cnt = new Map();
    for (const k of comp){
      const x = k % W, y = (k / W) | 0;
      for (let d = 0; d < 4; d++){
        const nx = x + D4[d][0], ny = y + D4[d][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const w = out[ny*W + nx];
        if (w >= 0 && w !== v) cnt.set(w, (cnt.get(w) || 0) + 1);
      }
    }
    let best = -1, bc = 0;
    for (const [c, k] of cnt) if (k > bc){ bc = k; best = c; }
    if (best < 0) continue;
    for (const k of comp){ out[k] = best; moved++; }
  }
  return moved;
}
function tidyApply(){
  if (!S.cells || !S.used || !S.used.length){ toast('先生成图纸'); return 0; }
  const th = clampInt($('tidyPreset').value, 0, 100);
  const k = clampInt($('tidyMin').value, 0, 20);
  if (!th && !k){ toast('强度选「关」且没设孤立杂色，没什么可整理的'); return 0; }

  const before = S.used.length;
  const ids = S.used.map(u => u.i);
  const parent = new Map(ids.map(id => [id, id]));
  const find = x => {
    let r = x;
    while (parent.get(r) !== r) r = parent.get(r);
    while (parent.get(x) !== r){ const nx = parent.get(x); parent.set(x, r); x = nx; }
    return r;
  };
  if (th > 0){
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){
      if (deltaE2000(S.palette[ids[i]].lab, S.palette[ids[j]].lab) < th){
        const a = find(ids[i]), b = find(ids[j]);
        if (a !== b) parent.set(b, a);
      }
    }
  }
  const groups = new Map();
  for (const id of ids){
    const r = th > 0 ? find(id) : id;
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(id);
  }
  const rep = new Map();
  for (const members of groups.values()){
    members.sort((a, b) => (S.counts.get(b) || 0) - (S.counts.get(a) || 0));
    for (const m of members) rep.set(m, members[0]);
  }

  const out = new Int32Array(S.cells.length).fill(-1);
  let changed = 0;
  for (let i = 0; i < S.cells.length; i++){
    const v = S.cells[i];
    if (v < 0) continue;
    const t = rep.get(v);
    const nv = (t === undefined) ? v : t;
    out[i] = nv;
    if (nv !== v) changed++;
  }
  if (k > 0) changed += despeckle(out, k);

  let after = 0;
  const seen = new Set();
  for (let i = 0; i < out.length; i++) if (out[i] >= 0 && !seen.has(out[i])){ seen.add(out[i]); after++; }
  if (!changed){ toast('没有找到可以合并的相近色'); return 0; }

  pushSnap();
  S.base = out;
  S.cells = limitColors(out, S.maxColors);
  S.highlight = -1; S.hlCells = null; S.selCell = -1;
  S.buf = null; S.bufCtx = null;
  ensureBuffer();
  recount(); renderUsage(); renderSimilar(); requestDraw();
  toast(`配色整理：${before} 色 → ${after} 色，改写 ${changed} 格（可撤销）`);
  return changed;
}
