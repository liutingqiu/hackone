name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show environment
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          node -v || true
          npm -v || true
      - name: Build (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build --if-present
          else
            echo "no package.json yet, skipping build"
          fi
      - name: Check docs
        run: |
          test -f README.md && echo "README ok"
          test -f docs/PLAN.md && echo "PLAN ok"