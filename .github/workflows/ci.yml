name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建单文件应用
        run: python3 app/build_html.py

      - name: 构建产物与 product/ 一致
        run: diff -q "app/拼豆图纸工具.html" product/index.html

      - name: 运行时回归
        run: node --test tests/runtime.test.cjs
